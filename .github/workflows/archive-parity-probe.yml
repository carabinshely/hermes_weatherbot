name: Temporary issue 12 archive parity probe

on:
  push:
    branches:
      - agent/issue-12-calibrated-uncertainty

permissions:
  contents: read

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate April production captures against the 18Z archive
        run: |
          python - <<'PY'
          import hashlib
          import json
          import urllib.error
          import urllib.parse
          import urllib.request
          from collections import defaultdict
          from pathlib import Path

          run = "2026-04-17T18:00"
          target_dates = ("2026-04-18", "2026-04-19", "2026-04-20")
          locations = {
              "nyc": (40.7772, -73.8726, "America/New_York"),
              "chicago": (41.9742, -87.9073, "America/Chicago"),
              "miami": (25.7959, -80.2870, "America/New_York"),
              "dallas": (32.8471, -96.8518, "America/Chicago"),
              "seattle": (47.4502, -122.3088, "America/Los_Angeles"),
              "atlanta": (33.6407, -84.4277, "America/New_York"),
          }

          def fetch_local_daily_maxima(city, latitude, longitude, timezone):
              params = {
                  "latitude": latitude,
                  "longitude": longitude,
                  "hourly": "temperature_2m",
                  "temperature_unit": "fahrenheit",
                  "timezone": timezone,
                  "models": "ecmwf_ifs025",
                  "bias_correction": "true",
                  "run": run,
              }
              url = "https://single-runs-api.open-meteo.com/v1/forecast?" + urllib.parse.urlencode(params)
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "hermes-weatherbot-issue-12-parity/1"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      raw = response.read()
              except urllib.error.HTTPError as exc:
                  raise SystemExit(
                      f"{city}: HTTP {exc.code}: "
                      + exc.read().decode("utf-8", errors="replace")
                  ) from exc
              payload = json.loads(raw)
              hourly = payload["hourly"]
              by_date = defaultdict(list)
              for timestamp, value in zip(
                  hourly["time"],
                  hourly["temperature_2m"],
                  strict=True,
              ):
                  if value is not None:
                      by_date[timestamp[:10]].append(value)
              print(
                  "FETCH "
                  + json.dumps(
                      {
                          "city": city,
                          "run": run,
                          "response_sha256": hashlib.sha256(raw).hexdigest(),
                          "timezone": payload.get("timezone"),
                          "utc_offset_seconds": payload.get("utc_offset_seconds"),
                          "url": url,
                      },
                      sort_keys=True,
                  )
              )
              return {day: max(values) for day, values in by_date.items() if values}

          rows = []
          for city, (latitude, longitude, timezone) in locations.items():
              archived = fetch_local_daily_maxima(city, latitude, longitude, timezone)
              for target_date in target_dates:
                  path = Path("data/markets") / f"{city}_{target_date}.json"
                  data = json.loads(path.read_text(encoding="utf-8"))
                  snapshots = sorted(data["forecast_snapshots"], key=lambda item: item["ts"])
                  earliest = snapshots[0]
                  latest = snapshots[-1]
                  value = archived[target_date]
                  row = {
                      "city": city,
                      "run": run,
                      "target_date": target_date,
                      "horizon": earliest["horizon"],
                      "earliest_ts": earliest["ts"],
                      "earliest_ecmwf_rounded_f": earliest["ecmwf"],
                      "latest_ts": latest["ts"],
                      "latest_ecmwf_rounded_f": latest["ecmwf"],
                      "archive_hourly_local_max_f": value,
                      "archive_rounded_f": round(value),
                      "earliest_rounded_error_f": round(value) - earliest["ecmwf"],
                      "latest_rounded_error_f": round(value) - latest["ecmwf"],
                      "raw_error_from_earliest_rounded_reference_f": value - earliest["ecmwf"],
                      "snapshot_file_sha": hashlib.sha256(path.read_bytes()).hexdigest(),
                  }
                  rows.append(row)
                  print("PARITY " + json.dumps(row, sort_keys=True))

          earliest_exact = sum(row["earliest_rounded_error_f"] == 0 for row in rows)
          latest_exact = sum(row["latest_rounded_error_f"] == 0 for row in rows)
          raw_errors = [abs(row["raw_error_from_earliest_rounded_reference_f"]) for row in rows]
          summary = {
              "run": run,
              "cities": len(locations),
              "pairs": len(rows),
              "earliest_rounded_exact_matches": earliest_exact,
              "earliest_rounded_exact_fraction": earliest_exact / len(rows),
              "latest_rounded_exact_matches": latest_exact,
              "latest_rounded_exact_fraction": latest_exact / len(rows),
              "mae_vs_earliest_rounded_reference_f": sum(raw_errors) / len(raw_errors),
              "max_abs_vs_earliest_rounded_reference_f": max(raw_errors),
          }
          print("SUMMARY " + json.dumps(summary, sort_keys=True))
          if earliest_exact != len(rows):
              raise SystemExit("18Z archive does not reproduce every earliest production capture")
          PY
