name: Migrate official Polymarket SDK

on:
  push:
    branches: [agent/official-polymarket-sdk]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/official-polymarket-sdk

      - name: Apply migration
        run: python tools/migrate_official_polymarket_sdk.py

      - name: Regenerate lock file
        run: |
          python -m pip install --quiet uv==0.11.33 ruff==0.15.22
          uv lock --upgrade-package polymarket-client
          ruff check --fix weatherbot/polymarket tests/polymarket
          ruff format weatherbot/polymarket tests/polymarket

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot_v3.py pyproject.toml uv.lock weatherbot/polymarket tests/polymarket docs/polymarket-sdk.md
          git commit -m "feat: migrate to official Polymarket SDK"
          git push origin HEAD:agent/official-polymarket-sdk
