name: Retry issue 59 self-review fixes

on:
  push:
    branches:
      - agent/issue-59-paper-rnd
    paths:
      - .github/workflows/issue59-self-review-fix-v2.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/issue-59-paper-rnd
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: uv sync --locked --all-groups
      - name: Apply review fixes and regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          experiment = Path("weatherbot/paper/experiment.py")
          text = experiment.read_text(encoding="utf-8")
          text = text.replace(
              "from dataclasses import dataclass, field\n",
              "from dataclasses import dataclass, field, replace\n",
              1,
          )
          text = text.replace(
              "    settlement: PaperSettlementEvidence | None = None\n"
              "    metadata: Mapping[str, object] = field(default_factory=_empty_metadata)\n",
              "    settlement: PaperSettlementEvidence | None = None\n"
              "    correlation_groups: tuple[str, ...] = ()\n"
              "    metadata: Mapping[str, object] = field(default_factory=_empty_metadata)\n",
              1,
          )
          text = text.replace(
              "        if self.execution_book is not None:\n",
              "        if any(not group.strip() for group in self.correlation_groups):\n"
              "            raise ValueError(\"paper correlation groups must not be blank\")\n"
              "        normalized_groups = tuple(\n"
              "            sorted({group.strip().casefold() for group in self.correlation_groups})\n"
              "        )\n"
              "        object.__setattr__(self, \"correlation_groups\", normalized_groups)\n"
              "        if self.execution_book is not None:\n",
              1,
          )
          text = text.replace(
              "            market_date=self.candidate.market_date,\n"
              "        )\n",
              "            market_date=self.candidate.market_date,\n"
              "            correlation_groups=self.correlation_groups,\n"
              "        )\n",
              1,
          )
          text = text.replace(
              "                \"settlement\": self.settlement,\n"
              "                \"metadata\": self.metadata,\n",
              "                \"settlement\": self.settlement,\n"
              "                \"correlation_groups\": self.correlation_groups,\n"
              "                \"metadata\": self.metadata,\n",
              1,
          )
          text = text.replace(
              "        if not self.engine_version.strip():\n"
              "            raise ValueError(\"paper engine_version must not be blank\")\n",
              "        if self.engine_version != _ENGINE_VERSION:\n"
              "            raise ValueError(\n"
              "                f\"paper engine_version must match running engine {_ENGINE_VERSION!r}\"\n"
              "            )\n",
              1,
          )
          marker = "\n\nclass PaperExperimentEngine:\n"
          helper = '''\n\ndef _pending_settlement_sort_key(\n    item: tuple[int, PaperEvidenceCase],\n) -> tuple[datetime, str]:\n    settlement = item[1].settlement\n    assert settlement is not None\n    return settlement.resolved_at, item[1].case_id\n\n\ndef _settle_due_positions(\n    *,\n    store: PortfolioRiskEventStore,\n    spec: PaperExperimentSpec,\n    pending: list[tuple[int, PaperEvidenceCase]],\n    results: list[PaperCaseResult],\n    before: datetime | None,\n) -> None:\n    \"\"\"Apply only settlements known strictly before the next decision time.\n\n    A settlement at or after a decision timestamp must never change the bankroll, loss,\n    drawdown, or exposure state used by that decision. Remaining settlements are applied\n    after all decisions have been evaluated.\n    \"\"\"\n    due: list[tuple[int, PaperEvidenceCase]] = []\n    remaining: list[tuple[int, PaperEvidenceCase]] = []\n    for index, case in pending:\n        settlement = case.settlement\n        assert settlement is not None\n        if before is None or settlement.resolved_at < before:\n            due.append((index, case))\n        else:\n            remaining.append((index, case))\n\n    for index, case in sorted(due, key=_pending_settlement_sort_key):\n        settlement_result, settlement_reason = _settle_hypothetical_position(\n            store=store,\n            spec=spec,\n            case=case,\n        )\n        results[index] = replace(\n            results[index],\n            settlement_result=settlement_result,\n            settlement_reason=settlement_reason,\n        )\n    pending[:] = remaining\n'''
          if marker not in text:
              raise SystemExit("experiment engine marker not found")
          text = text.replace(marker, helper + marker, 1)
          text = text.replace(
              "        store: PortfolioRiskEventStore | None = None\n\n"
              "        if economics is not None and economics.enabled:\n",
              "        store: PortfolioRiskEventStore | None = None\n"
              "        pending_settlements: list[tuple[int, PaperEvidenceCase]] = []\n\n"
              "        if economics is not None and economics.enabled:\n",
              1,
          )
          text = text.replace(
              "            ):\n"
              "                economic_status = EconomicEvaluationStatus.DISABLED\n",
              "            ):\n"
              "                if store is not None:\n"
              "                    _settle_due_positions(\n"
              "                        store=store,\n"
              "                        spec=spec,\n"
              "                        pending=pending_settlements,\n"
              "                        results=results,\n"
              "                        before=case.decision_at,\n"
              "                    )\n\n"
              "                economic_status = EconomicEvaluationStatus.DISABLED\n",
              1,
          )
          old_immediate = '''                        economic_status = EconomicEvaluationStatus.EVALUATED\n                        assert store is not None\n                        settlement_result, settlement_reason = _settle_hypothetical_position(\n                            store=store,\n                            spec=spec,\n                            case=case,\n                        )\n'''
          if old_immediate not in text:
              raise SystemExit("immediate settlement block not found")
          text = text.replace(
              old_immediate,
              "                        economic_status = EconomicEvaluationStatus.EVALUATED\n",
              1,
          )
          append_block = '''                results.append(\n                    PaperCaseResult(\n                        case_id=case.case_id,\n                        evidence_fingerprint=case.evidence_fingerprint,\n                        signal=signal,\n                        producer_evaluation=producer_evaluation,\n                        economic_status=economic_status,\n                        economic_result=economic_result,\n                        economic_reason=economic_reason,\n                        settlement_result=settlement_result,\n                        settlement_reason=settlement_reason,\n                    )\n                )\n'''
          replacement = append_block + '''                if (\n                    case.settlement is not None\n                    and economic_status is EconomicEvaluationStatus.EVALUATED\n                ):\n                    pending_settlements.append((len(results) - 1, case))\n\n            if store is not None:\n                _settle_due_positions(\n                    store=store,\n                    spec=spec,\n                    pending=pending_settlements,\n                    results=results,\n                    before=None,\n                )\n'''
          if append_block not in text:
              raise SystemExit("result append block not found")
          text = text.replace(append_block, replacement, 1)
          experiment.write_text(text, encoding="utf-8")

          tests = Path("tests/paper/test_experiment.py")
          test_text = tests.read_text(encoding="utf-8")
          test_text = test_text.replace(
              "from weatherbot.domain import Money\n",
              "from weatherbot.domain import Money, PositionStatus\n",
              1,
          )
          marker = "\n\ndef test_invalid_settlement_and_experiment_order_fail_closed() -> None:\n"
          additions = '''\n\ndef test_future_settlement_cannot_leak_into_an_earlier_decision() -> None:\n    first = replace(\n        _case(),\n        settlement=PaperSettlementEvidence(\n            resolved_at=NOW + timedelta(seconds=20),\n            outcome_payout=Decimal(\"1\"),\n        ),\n    )\n    second = replace(\n        _case(settlement=False),\n        case_id=\"later-decision\",\n        decision_at=NOW + timedelta(seconds=10),\n        candidate=replace(candidate(), market_id=\"paper-weather-market-2\"),\n        valuation_books={\n            first.scope.position_key: paper_book(\n                observed_at=NOW + timedelta(seconds=10),\n                book_hash=\"first-position-valuation\",\n            )\n        },\n    )\n    spec = PaperExperimentSpec(\n        policy=replace(policy(), strategy_version=\"candidate-v1\"),\n        evidence_cases=(first, second),\n        economics=_economics(\"100\"),\n    )\n\n    result = PaperExperimentEngine().evaluate(spec)\n    later_entry = result.cases[1].economic_result\n\n    assert later_entry is not None\n    assert later_entry.state.positions[first.scope.position_key].status is PositionStatus.OPEN\n    assert result.cases[0].settlement_result is not None\n\n\ndef test_due_settlement_is_applied_before_a_later_decision() -> None:\n    first = replace(\n        _case(),\n        settlement=PaperSettlementEvidence(\n            resolved_at=NOW + timedelta(seconds=5),\n            outcome_payout=Decimal(\"1\"),\n        ),\n    )\n    second = replace(\n        _case(settlement=False),\n        case_id=\"post-resolution-decision\",\n        decision_at=NOW + timedelta(seconds=10),\n        candidate=replace(candidate(), market_id=\"paper-weather-market-2\"),\n    )\n    spec = PaperExperimentSpec(\n        policy=replace(policy(), strategy_version=\"candidate-v1\"),\n        evidence_cases=(first, second),\n        economics=_economics(\"100\"),\n    )\n\n    result = PaperExperimentEngine().evaluate(spec)\n    later_entry = result.cases[1].economic_result\n\n    assert later_entry is not None\n    assert later_entry.state.positions[first.scope.position_key].status is PositionStatus.SETTLED\n    assert result.cases[0].settlement_result is not None\n\n\ndef test_engine_version_cannot_be_spoofed() -> None:\n    with pytest.raises(ValueError, match=\"must match running engine\"):\n        replace(_spec(settlement=False), engine_version=\"paper-experiment-v1\")\n\n\ndef test_correlation_groups_are_normalized_and_part_of_experiment_identity() -> None:\n    baseline = _spec(settlement=False)\n    grouped_case = replace(\n        baseline.evidence_cases[0],\n        correlation_groups=(\"Weather-System:Midwest\",),\n    )\n    grouped = replace(baseline, evidence_cases=(grouped_case,))\n\n    assert grouped_case.scope.correlation_groups == (\"weather-system:midwest\",)\n    assert grouped.experiment_id != baseline.experiment_id\n'''
          if marker not in test_text:
              raise SystemExit("test insertion marker not found")
          test_text = test_text.replace(marker, additions + marker, 1)
          tests.write_text(test_text, encoding="utf-8")

          readme = Path("README.md")
          readme_text = readme.read_text(encoding="utf-8")
          readme_text = readme_text.replace(
              "Only afterward may PAPER evaluate hypothetical sizing/risk/fills and settlement in an\n"
              "isolated temporary ledger. Changing PAPER bankroll, positions, fills, or prior PAPER\n",
              "Only afterward may PAPER evaluate hypothetical sizing/risk/fills and settlement in an\n"
              "isolated temporary ledger. Settlements are applied in event-time order and cannot affect\n"
              "an earlier decision. Changing PAPER bankroll, positions, fills, or prior PAPER\n",
              1,
          )
          readme.write_text(readme_text, encoding="utf-8")
          PY
          uv run ruff format weatherbot/paper/experiment.py tests/paper/test_experiment.py
          uv run ruff check weatherbot/paper/experiment.py tests/paper/test_experiment.py
          uv run pyright weatherbot/paper/experiment.py tests/paper/test_experiment.py
          uv run pytest -q tests/paper/test_experiment.py
      - name: Commit reviewed fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weatherbot/paper/experiment.py tests/paper/test_experiment.py README.md
          git commit -m "fix: prevent PAPER replay look-ahead bias"
          git push origin HEAD:agent/issue-59-paper-rnd
