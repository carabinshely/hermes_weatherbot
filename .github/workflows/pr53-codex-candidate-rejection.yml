name: Apply PR 53 candidate calibration rejection fix

on:
  push:
    branches:
      - agent/issue-48-calibrated-runtime-boundary
    paths:
      - .github/workflows/pr53-codex-candidate-rejection.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v6
        with:
          ref: agent/issue-48-calibrated-runtime-boundary

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked development environment
        run: uv sync --locked --all-groups

      - name: Apply candidate rejection fix
        run: python scripts/pr53_codex_candidate_rejection_patch.py

      - name: Format and lint
        run: |
          uv run ruff check --fix bot_v3.py tests/forecasting/test_bot_source.py
          uv run ruff format bot_v3.py tests/forecasting/test_bot_source.py
          uv run ruff check execution_modes.py runtime_security.py weatherbot tests
          uv run ruff format --check execution_modes.py runtime_security.py weatherbot tests

      - name: Type-check
        run: uv run pyright execution_modes.py runtime_security.py weatherbot tests

      - name: Focused regressions
        run: PYTHONPATH=. uv run pytest -q tests/forecasting/test_bot_source.py tests/forecasting/test_calibration_runtime.py tests/forecasting/test_calibrated_scanner_gate.py

      - name: Full suite
        run: PYTHONPATH=. uv run pytest -q

      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot_v3.py tests/forecasting/test_bot_source.py
          git commit -m "Handle candidate calibration rejection fail-closed"
          git push origin HEAD:agent/issue-48-calibrated-runtime-boundary
