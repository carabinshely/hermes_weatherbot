name: Fix created-order recovery

on:
  push:
    branches: [agent/durable-event-store]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/durable-event-store

      - name: Apply recovery fix
        run: python tools/fix_created_order_recovery.py

      - name: Format changed files
        run: |
          python -m pip install --quiet ruff==0.15.22
          ruff check --fix weatherbot/persistence tests/persistence
          ruff format weatherbot/persistence tests/persistence

      - name: Commit recovery fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!tools/fix_created_order_recovery.py' ':!.github/workflows/fix-created-order-recovery.yml'
          git commit -m "fix: reconcile created orders after submission starts"
          git push origin HEAD:agent/durable-event-store
