name: Format resolution observations

on:
  push:
    branches: [agent/authoritative-resolution-worker]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/authoritative-resolution-worker

      - name: Format observation module
        run: |
          python -m pip install --quiet ruff==0.15.22
          ruff format weatherbot/resolution/observations.py
          ruff format --check weatherbot/resolution/observations.py

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weatherbot/resolution/observations.py
          git commit -m "style: format observation context validation"
          git push origin HEAD:agent/authoritative-resolution-worker
