name: Sync resolution foundation with main

on:
  push:
    branches: [agent/resolution-foundation]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/resolution-foundation
          fetch-depth: 0

      - name: Merge current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            unmerged="$(git diff --name-only --diff-filter=U)"
            if [ "$unmerged" != "bot_v3.py" ]; then
              printf 'Unexpected merge conflicts:\n%s\n' "$unmerged"
              exit 1
            fi
            git checkout --ours bot_v3.py
            python tools/merge_resolution_foundation_main.py
            git add bot_v3.py
          fi
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            git diff --name-only --diff-filter=U
            exit 1
          fi

      - name: Validate merged branch
        run: |
          python -m pip install --quiet ruff==0.15.22 pyright==1.1.411 pytest==9.1.1
          ruff check weatherbot/markets tests/markets tests/legacy_loader.py tests/test_legacy_math.py
          ruff check --select E9,F63,F7,F82 bot_v3.py
          ruff format --check weatherbot/markets tests/markets bot_v3.py tests/legacy_loader.py tests/test_legacy_math.py
          pyright weatherbot/markets tests/markets
          pytest -q tests/markets tests/test_legacy_math.py tests/polymarket
          python -m compileall -q weatherbot bot_v3.py

      - name: Commit merge
        run: |
          git commit -m "merge: update resolution foundation from main"
          git push origin HEAD:agent/resolution-foundation
