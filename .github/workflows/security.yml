name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  current-tree-secrets:
    name: Current-tree secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Verify scanner detects a generated canary
        run: |
          mkdir -p /tmp/gitleaks-canary
          printf 'GITHUB_TOKEN=ghp_0123456789abcdefghijklmnopqrstuvwxyz\n' > /tmp/gitleaks-canary/canary.env
          if "$(go env GOPATH)/bin/gitleaks" dir /tmp/gitleaks-canary --redact --no-banner; then
            echo "Gitleaks failed to detect the generated canary" >&2
            exit 1
          fi

      - name: Scan current tree
        run: |
          set +e
          "$(go env GOPATH)/bin/gitleaks" dir . \
            --redact \
            --no-banner \
            --report-format json \
            --report-path /tmp/gitleaks.json
          status=$?
          set -e

          if [[ -s /tmp/gitleaks.json ]]; then
            jq -r '.[] | "::error file=\(.File),line=\(.StartLine)::Gitleaks rule \(.RuleID)"' \
              /tmp/gitleaks.json
          fi

          exit "$status"

  dependency-audit:
    name: Runtime dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Export runtime dependency set
        run: uv export --locked --no-dev --format requirements-txt --output-file /tmp/runtime.txt

      - name: Audit runtime dependencies
        run: uv run pip-audit --requirement /tmp/runtime.txt

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Validate workflows
        run: |
          "$(go env GOPATH)/bin/actionlint"
