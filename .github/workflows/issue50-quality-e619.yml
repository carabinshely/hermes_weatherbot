name: Issue 50 corrected quality e619
# Trigger after workflow registration; target tree remains immutable e619b2a5.

on:
  push:
    branches:
      - automation/issue49-v3-holdout-20260826
    paths:
      - .github/workflows/issue50-quality-e619.yml

permissions:
  contents: read

env:
  TARGET_HEAD: e619b2a58e557f7b2bf3468c602d2bb807326bdb

concurrency:
  group: issue50-corrected-quality-e619
  cancel-in-progress: false

jobs:
  quality:
    name: Python ${{ matrix.python-version }} corrected exact-tree quality
    runs-on: hermes-weather-calibration
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out corrected exact PR head
        uses: actions/checkout@v6
        with:
          ref: e619b2a58e557f7b2bf3468c602d2bb807326bdb
          fetch-depth: 0
          clean: true

      - name: Prove exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            requirements-pip-export.txt
            requirements-pip-conformance.txt

      - name: Verify lock file
        run: uv lock --check

      - name: Install minimal runtime and development tools
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .venv
          uv sync --locked --all-groups --python "$(command -v python)"

      - name: Verify wallet/live packages are absent from minimal profile
        run: |
          uv run python - <<'PY'
          from importlib.util import find_spec
          forbidden = ("eth_account", "polymarket", "web3")
          present = [name for name in forbidden if find_spec(name) is not None]
          if present:
              raise SystemExit(f"minimal profile unexpectedly installed: {present}")
          PY

      - name: Verify PIP-disabled imports without exporter dependencies
        run: |
          uv run python - <<'PY'
          from importlib.util import find_spec
          unexpected = [name for name in ("cryptography", "rfc8785") if find_spec(name)]
          if unexpected:
              raise SystemExit(f"minimal profile unexpectedly has PIP exporter deps: {unexpected}")
          import weatherbot.pip
          import weatherbot.producer.cli
          PY
          uv run python bot_v3.py --help
          uv run python -m weatherbot.pip --help

      - name: Install pinned PIP exporter profile
        run: uv pip install -r requirements-pip-export.txt

      - name: Verify exporter profile does not pull wallet/live packages
        run: |
          uv run python - <<'PY'
          from importlib.util import find_spec
          required = ("cryptography", "rfc8785")
          missing = [name for name in required if find_spec(name) is None]
          if missing:
              raise SystemExit(f"PIP exporter profile missing: {missing}")
          forbidden = ("eth_account", "polymarket", "web3")
          present = [name for name in forbidden if find_spec(name) is not None]
          if present:
              raise SystemExit(f"PIP exporter profile unexpectedly installed: {present}")
          PY

      - name: Verify public and internal command imports
        run: |
          uv run python bot_v3.py --help
          uv run python -m weatherbot.paper --help
          uv run python -m weatherbot.pip --help
          uv run python -m weatherbot.resolution --help
          uv run python -m weatherbot.resolution.observation_cli --help

      - name: Enforce public non-execution boundary
        run: uv run python scripts/ci/check_public_non_execution.py

      - name: Check formatting
        run: >
          uv run ruff format --check
          execution_modes.py runtime_security.py weatherbot tests
          scripts/ci/check_public_non_execution.py
          scripts/ci/check_pip_conformance.py scripts/ci/validate_pip_fixture.py

      - name: Lint maintained code
        run: >
          uv run ruff check
          execution_modes.py runtime_security.py weatherbot tests
          scripts/ci/check_public_non_execution.py
          scripts/ci/check_pip_conformance.py scripts/ci/validate_pip_fixture.py

      - name: Check critical legacy errors
        run: >
          uv run ruff check
          --select E9,F63,F7,F82
          bot_v1.py bot_v2.py bot_v3.py bot_v3_legacy.py bot_v3_legacy_impl.py

      - name: Type-check maintained code
        run: uv run pyright execution_modes.py runtime_security.py weatherbot tests

      - name: Compile Python sources
        run: >
          python -m compileall -q
          execution_modes.py runtime_security.py weatherbot
          bot_v1.py bot_v2.py bot_v3.py bot_v3_legacy.py bot_v3_legacy_impl.py tests scripts/ci

      - name: Run full test suite
        run: uv run pytest

      - name: Re-prove pinned accepted calibration runtime in isolation
        run: PYTHONPATH=. uv run pytest -q tests/forecasting/test_accepted_calibration_runtime.py

      - name: Check focused PIP exporter coverage
        if: matrix.python-version == '3.12'
        run: >
          PYTHONPATH=. uv run pytest -q tests/pip
          --cov=weatherbot.pip
          --cov-report=term-missing
          --cov-fail-under=70

      - name: Check focused paper coverage
        if: matrix.python-version == '3.12'
        run: >
          PYTHONPATH=. uv run pytest -q tests/paper
          --cov=weatherbot.paper
          --cov-report=term-missing
          --cov-fail-under=70
