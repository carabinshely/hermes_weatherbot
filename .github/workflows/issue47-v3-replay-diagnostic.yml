name: Issue 47 V3 development replay diagnostic

on:
  push:
    branches:
      - agent/issue-47-v3-policy
    paths:
      - .github/workflows/issue47-v3-replay-diagnostic.yml

permissions:
  actions: read
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/issue-47-v3-policy

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked environment
        run: uv sync --locked --all-groups

      - name: Download immutable normalized V2 evidence
        uses: actions/download-artifact@v4
        with:
          name: issue12-calibration-evidence-v2
          path: ${{ runner.temp }}/issue47-input
          github-token: ${{ github.token }}
          repository: carabinshely/hermes_weatherbot
          run-id: 31717108833

      - name: Verify frozen input contract
        shell: bash
        run: |
          set -euo pipefail
          input="${RUNNER_TEMP}/issue47-input"
          PYTHONPATH=. uv run python - <<'PY'
          from datetime import date
          from os import environ
          from pathlib import Path

          from weatherbot.forecasting.calibration_io import load_calibration_dataset

          root = Path(environ["RUNNER_TEMP"]) / "issue47-input"
          dataset = load_calibration_dataset(
              root / "dataset.jsonl",
              root / "dataset-manifest.json",
          )
          if dataset.manifest.start_date != date(2026, 4, 5):
              raise SystemExit(f"unexpected dataset start: {dataset.manifest.start_date}")
          if dataset.manifest.end_date != date(2026, 8, 10):
              raise SystemExit(f"unexpected dataset end: {dataset.manifest.end_date}")
          latest = max(sample.market_date for sample in dataset.samples)
          if latest > date(2026, 8, 10):
              raise SystemExit(f"final holdout contamination detected: {latest}")
          print(f"record_count={len(dataset.samples)}")
          print(f"start_date={dataset.manifest.start_date}")
          print(f"end_date={dataset.manifest.end_date}")
          print(f"dataset_sha256={dataset.manifest.dataset_sha256}")
          print(f"manifest_sha256={dataset.manifest.manifest_sha256}")
          PY
          sha256sum \
            "$input/dataset.jsonl" \
            "$input/dataset-manifest.json" \
            "$input/dataset-exclusions.json"

      - name: Run deterministic V3 development replay twice
        shell: bash
        run: |
          set -euo pipefail
          input="${RUNNER_TEMP}/issue47-input"
          out="${RUNNER_TEMP}/issue47-output"
          mkdir -p "$out"
          created_at="2026-08-14T05:50:00Z"
          for run in 1 2; do
            PYTHONPATH=. uv run python -m weatherbot.forecasting.calibration_v3_train \
              --records "$input/dataset.jsonl" \
              --manifest "$input/dataset-manifest.json" \
              --evaluation-kind development \
              --model-version issue12-v3-dev-replay \
              --created-at-utc "$created_at" \
              --training-end 2026-07-13 \
              --validation-start 2026-07-14 \
              --validation-end 2026-08-10 \
              --min-sample-count 30 \
              --artifact-out "$out/run${run}-artifact.json" \
              --report-out "$out/run${run}-report.json"
          done
          cmp "$out/run1-artifact.json" "$out/run2-artifact.json"
          cmp "$out/run1-report.json" "$out/run2-report.json"

      - name: Validate and print development evidence
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/issue47-output"
          PYTHONPATH=. uv run python - <<'PY'
          import json
          from os import environ
          from pathlib import Path

          root = Path(environ["RUNNER_TEMP"]) / "issue47-output"
          report = json.loads((root / "run1-report.json").read_text(encoding="utf-8"))
          assert report["fitting_policy"] == "v3-normal-runtime-v1"
          assert report["evaluation_kind"] == "development"
          assert report["validation_start"] == "2026-07-14"
          assert report["validation_end"] == "2026-08-10"
          decisions = report["group_fit_decisions"]
          eligible = [item for item in decisions if item["runtime_eligible"]]
          omitted = [item for item in decisions if not item["runtime_eligible"]]
          assert eligible
          assert all(item["runtime_distribution_type"] == "normal" for item in eligible)
          assert all(item["omission_reason"] for item in omitted)
          assert all(
              item["diagnostics"]["empirical_selection_crps"] is not None
              for item in decisions
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
          printf '%s\n' '--- deterministic V3 evidence hashes ---'
          sha256sum \
            "$out/run1-artifact.json" \
            "$out/run1-report.json" \
            "$out/run2-artifact.json" \
            "$out/run2-report.json"
          printf '%s\n' 'development evidence only — not final V3 holdout and not an accepted runtime artifact'

      - name: Upload temporary development evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue47-v3-development-evidence
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/issue47-output/run1-artifact.json
            ${{ runner.temp }}/issue47-output/run1-report.json
