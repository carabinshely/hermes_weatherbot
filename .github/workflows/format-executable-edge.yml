name: Format executable edge contracts

on:
  push:
    branches: [agent/executable-edge-validation]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/executable-edge-validation

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install development profile
        run: uv sync --locked --all-groups

      - name: Apply type alias fix
        run: python tools/fix_executable_edge_type_alias.py

      - name: Apply canonical formatting
        run: |
          uv run ruff check --fix weatherbot/quoting tests/quoting
          uv run ruff format weatherbot/quoting tests/quoting
          uv run pyright weatherbot/quoting tests/quoting
          uv run pytest -q tests/quoting

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weatherbot/quoting tests/quoting
          git commit -m "style: format executable edge contracts"
          git push origin HEAD:agent/executable-edge-validation
