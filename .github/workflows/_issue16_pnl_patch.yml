name: issue16-pnl-patch

on:
  push:
    branches: [agent/issue-16-portfolio-risk]
    paths:
      - .github/workflows/_issue16_pnl_patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/issue-16-portfolio-risk
      - name: Apply exact PnL ordering fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('weatherbot/risk/portfolio.py')
          text = path.read_text()
          old = '''    state = LedgerState.empty(currency)\n    realized = Money.zero(currency)\n    for event in events:\n        if event.occurred_at > evaluated_at:\n            break\n        before = _realized_total(state)\n        state = apply_event(state, event)\n        after = _realized_total(state)\n        if start <= event.occurred_at.astimezone(UTC) <= end:\n            realized += after - before\n    return realized\n'''
          new = '''    state = LedgerState.empty(currency)\n    realized = Money.zero(currency)\n    for event in events:\n        before = _realized_total(state)\n        state = apply_event(state, event)\n        after = _realized_total(state)\n        event_utc = event.occurred_at.astimezone(UTC)\n        if event.occurred_at <= evaluated_at and start <= event_utc <= end:\n            realized += after - before\n    return realized\n'''
          if old not in text:
              raise SystemExit('expected realized-PnL loop not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add weatherbot/risk/portfolio.py
          git commit -m 'Scan realized PnL by ledger sequence without timestamp break'
          git push origin HEAD:agent/issue-16-portfolio-risk
