name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify lock file
        run: uv lock --check

      - name: Install minimal runtime and development tools
        run: uv sync --locked --all-groups

      - name: Verify live packages are absent from minimal profile
        run: |
          uv run python - <<'PY'
          from importlib.util import find_spec

          forbidden = ("eth_account", "polymarket", "web3")
          present = [name for name in forbidden if find_spec(name) is not None]
          if present:
              raise SystemExit(f"minimal profile unexpectedly installed: {present}")

          import weatherbot.polymarket
          import weatherbot.resolution
          PY

      - name: Verify safe command imports without live extras
        run: |
          uv run python bot_v3.py --help
          uv run python -m weatherbot.resolution --help
          uv run python -m weatherbot.resolution.observation_cli --help

      - name: Verify live command fails with installation guidance
        run: |
          cp config.json /tmp/config.json
          trap 'mv /tmp/config.json config.json' EXIT
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("config.json")
          config = json.loads(path.read_text(encoding="utf-8"))
          config["mode"] = "live"
          path.write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")
          PY
          set +e
          output="$(uv run python bot_v3.py status --mode live --confirm-live 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 2
          grep -F 'uv sync --locked --no-dev --extra live' <<<"$output"
          grep -F 'live mode requires optional dependencies' <<<"$output"

      - name: Check formatting
        run: uv run ruff format --check execution_modes.py runtime_security.py weatherbot tests

      - name: Lint maintained code
        run: uv run ruff check execution_modes.py runtime_security.py weatherbot tests

      - name: Check critical legacy errors
        run: >
          uv run ruff check
          --select E9,F63,F7,F82
          bot_v1.py bot_v2.py bot_v3.py

      - name: Type-check maintained code
        run: uv run pyright execution_modes.py runtime_security.py weatherbot tests

      - name: Compile Python sources
        run: >
          python -m compileall -q
          execution_modes.py runtime_security.py weatherbot
          bot_v1.py bot_v2.py bot_v3.py tests

      - name: Run tests
        run: uv run pytest

      - name: Check focused paper coverage
        if: matrix.python-version == '3.12'
        run: >
          PYTHONPATH=. uv run pytest -q tests/paper
          --cov=weatherbot.paper
          --cov-report=term-missing
          --cov-fail-under=70

      - name: Install and smoke-test live extra
        if: matrix.python-version == '3.12'
        run: |
          uv sync --locked --all-groups --extra live
          uv run --extra live python - <<'PY'
          from importlib.util import find_spec

          required = ("eth_account", "polymarket", "web3")
          missing = [name for name in required if find_spec(name) is None]
          if missing:
              raise SystemExit(f"live profile is missing: {missing}")

          from weatherbot.dependencies import require_live_dependencies
          from weatherbot.polymarket import OfficialPolymarketReadClient

          require_live_dependencies()
          assert OfficialPolymarketReadClient is not None
          PY
          uv run --extra live pytest -q tests/polymarket

  issue47-v3-development-replay:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/issue-47-v3-policy'
    name: Issue 47 V3 development replay
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked environment
        run: uv sync --locked --all-groups

      - name: Download immutable normalized V2 evidence
        uses: actions/download-artifact@v4
        with:
          name: issue12-calibration-evidence-v2
          path: ${{ runner.temp }}/issue47-input
          github-token: ${{ github.token }}
          repository: carabinshely/hermes_weatherbot
          run-id: 31717108833

      - name: Verify frozen input contract
        shell: bash
        run: |
          set -euo pipefail
          input="${RUNNER_TEMP}/issue47-input"
          PYTHONPATH=. uv run python - <<'PY'
          from datetime import date
          from os import environ
          from pathlib import Path

          from weatherbot.forecasting.calibration_io import load_calibration_dataset

          root = Path(environ["RUNNER_TEMP"]) / "issue47-input"
          dataset = load_calibration_dataset(
              root / "dataset.jsonl",
              root / "dataset-manifest.json",
          )
          if dataset.manifest.start_date != date(2026, 4, 5):
              raise SystemExit(f"unexpected dataset start: {dataset.manifest.start_date}")
          if dataset.manifest.end_date != date(2026, 8, 10):
              raise SystemExit(f"unexpected dataset end: {dataset.manifest.end_date}")
          latest = max(sample.market_date for sample in dataset.samples)
          if latest > date(2026, 8, 10):
              raise SystemExit(f"final holdout contamination detected: {latest}")
          print(f"record_count={len(dataset.samples)}")
          print(f"start_date={dataset.manifest.start_date}")
          print(f"end_date={dataset.manifest.end_date}")
          print(f"dataset_sha256={dataset.manifest.dataset_sha256}")
          print(f"manifest_sha256={dataset.manifest.manifest_sha256}")
          PY
          sha256sum \
            "$input/dataset.jsonl" \
            "$input/dataset-manifest.json" \
            "$input/dataset-exclusions.json"

      - name: Run deterministic V3 development replay twice
        shell: bash
        run: |
          set -euo pipefail
          input="${RUNNER_TEMP}/issue47-input"
          out="${RUNNER_TEMP}/issue47-output"
          mkdir -p "$out"
          created_at="2026-08-14T05:50:00Z"
          for run in 1 2; do
            PYTHONPATH=. uv run python -m weatherbot.forecasting.calibration_v3_train \
              --records "$input/dataset.jsonl" \
              --manifest "$input/dataset-manifest.json" \
              --evaluation-kind development \
              --model-version issue12-v3-dev-replay \
              --created-at-utc "$created_at" \
              --training-end 2026-07-13 \
              --validation-start 2026-07-14 \
              --validation-end 2026-08-10 \
              --min-sample-count 30 \
              --artifact-out "$out/run${run}-artifact.json" \
              --report-out "$out/run${run}-report.json"
          done
          cmp "$out/run1-artifact.json" "$out/run2-artifact.json"
          cmp "$out/run1-report.json" "$out/run2-report.json"

      - name: Validate and print development evidence
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/issue47-output"
          PYTHONPATH=. uv run python - <<'PY'
          import json
          from os import environ
          from pathlib import Path

          root = Path(environ["RUNNER_TEMP"]) / "issue47-output"
          report = json.loads((root / "run1-report.json").read_text(encoding="utf-8"))
          assert report["fitting_policy"] == "v3-normal-runtime-v1"
          assert report["evaluation_kind"] == "development"
          assert report["validation_start"] == "2026-07-14"
          assert report["validation_end"] == "2026-08-10"
          decisions = report["group_fit_decisions"]
          eligible = [item for item in decisions if item["runtime_eligible"]]
          omitted = [item for item in decisions if not item["runtime_eligible"]]
          assert eligible
          assert all(item["runtime_distribution_type"] == "normal" for item in eligible)
          assert all(item["omission_reason"] for item in omitted)
          assert all(
              item["diagnostics"]["empirical_selection_crps"] is not None
              for item in decisions
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
          printf '%s\n' '--- deterministic V3 evidence hashes ---'
          sha256sum \
            "$out/run1-artifact.json" \
            "$out/run1-report.json" \
            "$out/run2-artifact.json" \
            "$out/run2-report.json"
          printf '%s\n' 'development evidence only — not final V3 holdout and not an accepted runtime artifact'

      - name: Upload temporary development evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue47-v3-development-evidence
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/issue47-output/run1-artifact.json
            ${{ runner.temp }}/issue47-output/run1-report.json
