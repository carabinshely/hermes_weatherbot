name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            requirements-pip-export.txt

      - name: Verify lock file
        run: uv lock --check

      - name: Install minimal runtime and development tools
        run: uv sync --locked --all-groups

      - name: Verify wallet/live packages are absent from minimal profile
        run: |
          uv run python - <<'PY'
          from importlib.util import find_spec

          forbidden = ("eth_account", "polymarket", "web3")
          present = [name for name in forbidden if find_spec(name) is not None]
          if present:
              raise SystemExit(f"minimal profile unexpectedly installed: {present}")
          PY

      - name: Install pinned PIP exporter profile
        run: uv pip install -r requirements-pip-export.txt

      - name: Verify exporter profile does not pull wallet/live packages
        run: |
          uv run python - <<'PY'
          from importlib.util import find_spec

          required = ("cryptography", "rfc8785")
          missing = [name for name in required if find_spec(name) is None]
          if missing:
              raise SystemExit(f"PIP exporter profile missing: {missing}")
          forbidden = ("eth_account", "polymarket", "web3")
          present = [name for name in forbidden if find_spec(name) is not None]
          if present:
              raise SystemExit(f"PIP exporter profile unexpectedly installed: {present}")
          PY

      - name: Verify public and internal command imports
        run: |
          uv run python bot_v3.py --help
          uv run python -m weatherbot.paper --help
          uv run python -m weatherbot.pip --help
          uv run python -m weatherbot.resolution --help
          uv run python -m weatherbot.resolution.observation_cli --help

      - name: Enforce public non-execution boundary
        run: uv run python scripts/ci/check_public_non_execution.py

      - name: Check formatting
        run: >
          uv run ruff format --check
          execution_modes.py runtime_security.py weatherbot tests
          scripts/ci/check_public_non_execution.py
          scripts/ci/check_pip_conformance.py scripts/ci/validate_pip_fixture.py

      - name: Lint maintained code
        run: >
          uv run ruff check
          execution_modes.py runtime_security.py weatherbot tests
          scripts/ci/check_public_non_execution.py
          scripts/ci/check_pip_conformance.py scripts/ci/validate_pip_fixture.py

      - name: Check critical legacy errors
        run: >
          uv run ruff check
          --select E9,F63,F7,F82
          bot_v1.py bot_v2.py bot_v3.py bot_v3_legacy.py bot_v3_legacy_impl.py

      - name: Type-check maintained code
        run: uv run pyright execution_modes.py runtime_security.py weatherbot tests

      - name: Compile Python sources
        run: >
          python -m compileall -q
          execution_modes.py runtime_security.py weatherbot
          bot_v1.py bot_v2.py bot_v3.py bot_v3_legacy.py bot_v3_legacy_impl.py tests scripts/ci

      - name: Run tests
        run: uv run pytest

      - name: Check focused PIP exporter coverage
        if: matrix.python-version == '3.12'
        run: >
          PYTHONPATH=. uv run pytest -q tests/pip
          --cov=weatherbot.pip
          --cov-report=term-missing
          --cov-fail-under=70

      - name: Check focused paper coverage
        if: matrix.python-version == '3.12'
        run: >
          PYTHONPATH=. uv run pytest -q tests/paper
          --cov=weatherbot.paper
          --cov-report=term-missing
          --cov-fail-under=70

  pip-conformance:
    name: PIP contract conformance
    runs-on: ubuntu-latest
    steps:
      - name: Check out Hermes
        uses: actions/checkout@v6

      - name: Check out pinned PIP authority
        uses: actions/checkout@v6
        with:
          repository: carabinshely/prediction-intelligence-platform
          ref: a21c3e2ec9e7d5fdd453df4d7cbf641989493af8
          path: pip_contract
          persist-credentials: false

      - name: Set up Hermes Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install Hermes test and exporter dependencies
        run: |
          uv sync --locked --all-groups
          uv pip install -r requirements-pip-export.txt

      - name: Cross-check Hermes against pinned PIP vectors
        run: >
          PYTHONPATH=. uv run python scripts/ci/check_pip_conformance.py
          pip_contract pip_tmp

      - name: Set up PIP Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Self-test pinned PIP conformance authority
        working-directory: pip_contract
        run: uv run --frozen python -m scripts.conformance self-test

      - name: Validate real Hermes envelope in PIP environment
        working-directory: pip_contract
        run: >
          PYTHONPATH=. uv run --frozen python
          ../scripts/ci/validate_pip_fixture.py ../pip_tmp
