name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: agent/issue-27-paper-money

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify lock file
        run: uv lock --check

      - name: Install minimal runtime and development tools
        run: uv sync --locked --all-groups

      - name: Patch final PAPER invariants
        if: matrix.python-version == '3.12' && github.actor != 'github-actions[bot]'
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path("weatherbot/paper/service.py")
          text = service.read_text()
          old = '''        probability = Decimal(self.model_probability)\n        if probability <= 0 or probability >= 1:\n            raise ValueError("paper model probability must be between zero and one")\n        bucket_key = self.audit_metadata.get("bucket_key")\n'''
          new = '''        probability = Decimal(self.model_probability)\n        if probability <= 0 or probability >= 1:\n            raise ValueError("paper model probability must be between zero and one")\n        if str(self.scope.outcome_id) != str(self.decision_order_book.token_id):\n            raise ValueError("paper scope outcome_id must match the selected decision-book token")\n        if self.execution_order_book.condition_id != self.decision_order_book.condition_id:\n            raise ValueError("paper execution book must use the decision-book condition")\n        if self.execution_order_book.token_id != self.decision_order_book.token_id:\n            raise ValueError("paper execution book must use the decision-book token")\n        bucket_key = self.audit_metadata.get("bucket_key")\n'''
          if old not in text:
              raise SystemExit("paper entry validation marker not found")
          service.write_text(text.replace(old, new, 1))

          bot = Path("bot_v3.py")
          bot_text = bot.read_text()
          old_banner = '            print("  Paper fills:   pending implementation in #27")\n'
          new_banner = '            print(f"  Paper ledger:  {PAPER_RUNTIME.ledger_path}")\n'
          if old_banner not in bot_text:
              raise SystemExit("stale PAPER banner not found")
          bot.write_text(bot_text.replace(old_banner, new_banner, 1))
          PY
          uv run ruff format weatherbot/paper/service.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add weatherbot/paper/service.py bot_v3.py
          git commit -m 'Enforce PAPER token identity and update runtime banner'
          git push origin HEAD:agent/issue-27-paper-money

      - name: Verify live packages are absent from minimal profile
        run: |
          uv run python - <<'PY'
          from importlib.util import find_spec

          forbidden = ("eth_account", "polymarket", "web3")
          present = [name for name in forbidden if find_spec(name) is not None]
          if present:
              raise SystemExit(f"minimal profile unexpectedly installed: {present}")

          import weatherbot.polymarket
          import weatherbot.resolution
          PY

      - name: Verify safe command imports without live extras
        run: |
          uv run python bot_v3.py --help
          uv run python -m weatherbot.resolution --help
          uv run python -m weatherbot.resolution.observation_cli --help

      - name: Verify live command fails with installation guidance
        run: |
          cp config.json /tmp/config.json
          trap 'mv /tmp/config.json config.json' EXIT
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("config.json")
          config = json.loads(path.read_text(encoding="utf-8"))
          config["mode"] = "live"
          path.write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")
          PY
          set +e
          output="$(uv run python bot_v3.py status --mode live --confirm-live 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 2
          grep -F 'uv sync --locked --no-dev --extra live' <<<"$output"
          grep -F 'live mode requires optional dependencies' <<<"$output"

      - name: Check formatting
        run: uv run ruff format --check execution_modes.py runtime_security.py weatherbot tests

      - name: Lint maintained code
        run: uv run ruff check execution_modes.py runtime_security.py weatherbot tests

      - name: Check critical legacy errors
        run: >
          uv run ruff check
          --select E9,F63,F7,F82
          bot_v1.py bot_v2.py bot_v3.py

      - name: Type-check maintained code
        run: uv run pyright execution_modes.py runtime_security.py weatherbot tests

      - name: Compile Python sources
        run: >
          python -m compileall -q
          execution_modes.py runtime_security.py weatherbot
          bot_v1.py bot_v2.py bot_v3.py tests

      - name: Run tests
        run: uv run pytest

      - name: Check focused paper coverage
        if: matrix.python-version == '3.12'
        run: >
          PYTHONPATH=. uv run pytest -q tests/paper
          --cov=weatherbot.paper
          --cov-report=term-missing
          --cov-fail-under=70

      - name: Install and smoke-test live extra
        if: matrix.python-version == '3.12'
        run: |
          uv sync --locked --all-groups --extra live
          uv run --extra live python - <<'PY'
          from importlib.util import find_spec

          required = ("eth_account", "polymarket", "web3")
          missing = [name for name in required if find_spec(name) is None]
          if missing:
              raise SystemExit(f"live profile is missing: {missing}")

          from weatherbot.dependencies import require_live_dependencies
          from weatherbot.polymarket import OfficialPolymarketReadClient

          require_live_dependencies()
          assert OfficialPolymarketReadClient is not None
          PY
          uv run --extra live pytest -q tests/polymarket
