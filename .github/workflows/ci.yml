name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify lock file
        run: uv lock --check

      - name: Install minimal runtime and development tools
        run: uv sync --locked --all-groups

      - name: Verify wallet/live packages are absent from minimal profile
        run: |
          uv run python - <<'PY'
          from importlib.util import find_spec

          forbidden = ("eth_account", "polymarket", "web3")
          present = [name for name in forbidden if find_spec(name) is not None]
          if present:
              raise SystemExit(f"minimal profile unexpectedly installed: {present}")
          PY

      - name: Verify public and internal command imports
        run: |
          uv run python bot_v3.py --help
          uv run python -m weatherbot.paper --help
          uv run python -m weatherbot.resolution --help
          uv run python -m weatherbot.resolution.observation_cli --help

      - name: Enforce public non-execution boundary
        run: uv run python scripts/ci/check_public_non_execution.py

      - name: Check formatting
        run: |
          uv run ruff format --diff \
            execution_modes.py runtime_security.py weatherbot tests scripts/ci/check_public_non_execution.py \
            | tee /tmp/ruff-format.diff
          test ! -s /tmp/ruff-format.diff

      - name: Lint maintained code
        run: >
          uv run ruff check
          execution_modes.py runtime_security.py weatherbot tests scripts/ci/check_public_non_execution.py

      - name: Check critical legacy errors
        run: >
          uv run ruff check
          --select E9,F63,F7,F82
          bot_v1.py bot_v2.py bot_v3.py bot_v3_legacy.py bot_v3_legacy_impl.py

      - name: Type-check maintained code
        run: uv run pyright execution_modes.py runtime_security.py weatherbot tests

      - name: Compile Python sources
        run: >
          python -m compileall -q
          execution_modes.py runtime_security.py weatherbot
          bot_v1.py bot_v2.py bot_v3.py bot_v3_legacy.py bot_v3_legacy_impl.py tests

      - name: Run tests
        run: uv run pytest

      - name: Check focused paper coverage
        if: matrix.python-version == '3.12'
        run: >
          PYTHONPATH=. uv run pytest -q tests/paper
          --cov=weatherbot.paper
          --cov-report=term-missing
          --cov-fail-under=70
