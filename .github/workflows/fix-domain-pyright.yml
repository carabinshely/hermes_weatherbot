name: Fix domain Pyright

on:
  push:
    branches: [agent/domain-state-machines]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/domain-state-machines

      - name: Exhaust the event union explicitly
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("weatherbot/domain/reducers.py")
          content = path.read_text(encoding="utf-8")
          old = '''    elif isinstance(event, MarketResolved):
        next_state = _apply_resolution(state, event)
    elif isinstance(event, PositionSettled):
        next_state = _apply_settlement(state, event)
    else:
        raise TypeError(f"unsupported domain event: {type(event).__name__}")
'''
          new = '''    elif isinstance(event, MarketResolved):
        next_state = _apply_resolution(state, event)
    else:
        next_state = _apply_settlement(state, event)
'''
          if content.count(old) != 1:
              raise SystemExit(f"event union marker count: {content.count(old)}")
          path.write_text(content.replace(old, new), encoding="utf-8")
          PY

      - name: Format changed domain files
        run: |
          python -m pip install --quiet ruff==0.15.22
          ruff check --fix weatherbot/domain/events.py weatherbot/domain/model.py weatherbot/domain/state.py weatherbot/domain/reducers.py
          ruff format weatherbot/domain/events.py weatherbot/domain/model.py weatherbot/domain/state.py weatherbot/domain/reducers.py

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weatherbot/domain/events.py weatherbot/domain/model.py weatherbot/domain/state.py weatherbot/domain/reducers.py
          git commit -m "fix: satisfy strict domain typing"
          git push origin HEAD:agent/domain-state-machines
