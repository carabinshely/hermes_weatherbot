name: Format issue 12 sparse test

on:
  push:
    branches:
      - agent/issue-12-calibrated-uncertainty
    paths:
      - .github/workflows/issue12-format-sparse-test.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/issue-12-calibrated-uncertainty
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: uv sync --locked --all-groups
      - name: Format sparse forecast-gap test
        run: |
          uv run ruff check --fix tests/forecasting/test_calibration_sparse_forecast_gap.py
          uv run ruff format tests/forecasting/test_calibration_sparse_forecast_gap.py
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          path=tests/forecasting/test_calibration_sparse_forecast_gap.py
          if git diff --quiet -- "$path"; then
            echo "No formatter changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$path"
          git commit -m "Format sparse forecast-gap test"
          git push origin HEAD:agent/issue-12-calibrated-uncertainty
