name: Format PR 53 calibration runtime

on:
  push:
    branches:
      - agent/issue-48-calibrated-runtime-boundary
    paths:
      - .github/workflows/pr53-format-runtime.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v6
        with:
          ref: agent/issue-48-calibrated-runtime-boundary

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked development environment
        run: uv sync --locked --all-groups

      - name: Apply exact Ruff formatting
        run: |
          uv run ruff format \
            weatherbot/forecasting/runtime.py \
            tests/forecasting/test_calibrated_scanner_gate.py \
            tests/forecasting/test_calibration_runtime.py

      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            weatherbot/forecasting/runtime.py \
            tests/forecasting/test_calibrated_scanner_gate.py \
            tests/forecasting/test_calibration_runtime.py; then
            echo "No formatter changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            weatherbot/forecasting/runtime.py \
            tests/forecasting/test_calibrated_scanner_gate.py \
            tests/forecasting/test_calibration_runtime.py
          git commit -m "Apply exact Ruff formatting for calibration runtime"
          git push origin HEAD:agent/issue-48-calibrated-runtime-boundary
