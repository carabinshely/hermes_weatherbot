name: Fix persistence lint

on:
  push:
    branches: [agent/durable-event-store]

permissions:
  contents: write

jobs:
  lint:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/durable-event-store

      - name: Apply Ruff fixes
        run: |
          python -m pip install --quiet ruff==0.15.22
          ruff check --fix weatherbot/persistence tests/persistence
          ruff format weatherbot/persistence tests/persistence

      - name: Commit lint fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weatherbot/persistence tests/persistence
          git commit -m "style: fix persistence lint"
          git push origin HEAD:agent/durable-event-store
