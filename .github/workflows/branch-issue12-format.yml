name: Temporary issue 12 formatter verification

on:
  push:
    branches:
      - agent/issue-12-calibrated-uncertainty

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/issue-12-calibrated-uncertainty
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - run: uv sync --locked --all-groups
      - name: Apply bounded archive fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("weatherbot/forecasting/archive.py")
          text = path.read_text(encoding="utf-8")

          old_noqa = "with urllib.request.urlopen(request, timeout=timeout_seconds) as response:  # noqa: S310"
          new_noqa = "with urllib.request.urlopen(request, timeout=timeout_seconds) as response:"
          if text.count(old_noqa) != 1:
              raise SystemExit("expected exactly one stale S310 suppression")
          text = text.replace(old_noqa, new_noqa)

          old_decimal = '''def _decimal(value: Decimal | int | str | float, *, label: str) -> Decimal:
              if isinstance(value, bool):
                  raise CalibrationError(f"{label} must be decimal")
          '''
          old_decimal = "\n".join(
              line[14:] if line.startswith("              ") else line
              for line in old_decimal.splitlines()
          ) + "\n"
          new_decimal = '''def _decimal(value: object, *, label: str) -> Decimal:
              if isinstance(value, bool) or not isinstance(value, (Decimal, int, str, float)):
                  raise CalibrationError(f"{label} must be decimal")
          '''
          new_decimal = "\n".join(
              line[14:] if line.startswith("              ") else line
              for line in new_decimal.splitlines()
          ) + "\n"
          if text.count(old_decimal) != 1:
              raise SystemExit("expected exactly one archive _decimal signature")
          path.write_text(text.replace(old_decimal, new_decimal), encoding="utf-8")

          test_path = Path("tests/forecasting/test_archive.py")
          test_text = test_path.read_text(encoding="utf-8")
          old_decision = "        decision_local_time=time(hour=18, minute=30),\n"
          new_decision = "        decision_local_time=time(hour=0, minute=15),\n"
          old_age = "        min_safe_run_age=timedelta(hours=8),\n"
          new_age = "        min_safe_run_age=timedelta(hours=12),\n"
          if test_text.count(old_decision) != 1 or test_text.count(old_age) != 1:
              raise SystemExit("expected exactly one archive availability fixture")
          test_text = test_text.replace(old_decision, new_decision).replace(old_age, new_age)
          test_path.write_text(test_text, encoding="utf-8")
          PY
      - run: uv run ruff format weatherbot/forecasting/archive.py tests/forecasting/test_archive.py
      - run: uv run ruff check weatherbot/forecasting/archive.py tests/forecasting/test_archive.py
      - name: Verify strict typing
        run: uv run pyright execution_modes.py runtime_security.py weatherbot tests
      - name: Verify forecasting tests
        run: PYTHONPATH=. uv run pytest -q tests/forecasting
      - name: Commit verified formatter changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weatherbot/forecasting/archive.py tests/forecasting/test_archive.py
          git commit -m "Verify issue 12 archive sampler"
          git push origin HEAD:agent/issue-12-calibrated-uncertainty
