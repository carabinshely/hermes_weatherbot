name: Temporary issue 12 formatter verification

on:
  push:
    branches:
      - agent/issue-12-calibrated-uncertainty

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/issue-12-calibrated-uncertainty
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - run: uv sync --locked --all-groups
      - name: Remove stale Ruff suppression
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("weatherbot/forecasting/archive.py")
          text = path.read_text(encoding="utf-8")
          old = "with urllib.request.urlopen(request, timeout=timeout_seconds) as response:  # noqa: S310"
          new = "with urllib.request.urlopen(request, timeout=timeout_seconds) as response:"
          if text.count(old) != 1:
              raise SystemExit("expected exactly one stale S310 suppression")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - run: uv run ruff format weatherbot/forecasting/archive.py tests/forecasting/test_archive.py
      - run: uv run ruff check weatherbot/forecasting/archive.py tests/forecasting/test_archive.py
      - name: Verify strict typing
        run: uv run pyright execution_modes.py runtime_security.py weatherbot tests
      - name: Verify forecasting tests
        run: PYTHONPATH=. uv run pytest -q tests/forecasting
      - name: Commit verified formatter changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weatherbot/forecasting/archive.py tests/forecasting/test_archive.py
          git commit -m "Format issue 12 archive sampler"
          git push origin HEAD:agent/issue-12-calibrated-uncertainty
