name: Apply execution modes

on:
  push:
    branches: [agent/execution-modes]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/execution-modes

      - name: Update temporary patch script
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/apply_execution_modes.py")
          content = path.read_text(encoding="utf-8")
          content = content.replace("from typing import TypeVar\n", "")
          content = content.replace(
              'T = TypeVar("T")\n\n\ndef run_live_operation(\n',
              'def run_live_operation[T](\n',
          )
          path.write_text(content, encoding="utf-8")
          PY

      - name: Apply patch
        run: python tools/apply_execution_modes.py

      - name: Format maintained Python code
        run: |
          python -m pip install --quiet ruff==0.15.22
          ruff format execution_modes.py runtime_security.py tests
          ruff check --fix execution_modes.py runtime_security.py tests

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!tools/apply_execution_modes.py' ':!.github/workflows/apply-execution-modes.yml'
          git commit -m "feat: enforce explicit execution modes"
          git push origin HEAD:agent/execution-modes
