name: Fix execution mode output

on:
  push:
    branches: [agent/execution-modes]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/execution-modes

      - name: Apply fix
        run: python tools/fix_execution_mode_output.py

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot_v3.py
          git commit -m "fix: keep non-live loop wallet-free"
          git push origin HEAD:agent/execution-modes
