name: Fix execution mode output

on:
  push:
    branches: [agent/execution-modes]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/execution-modes

      - name: Fix live and non-live status output
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("bot_v3.py")
          content = path.read_text(encoding="utf-8")
          old_status = '''    print(f"  Mode:     {context.label}")
    if context.mode is ExecutionMode.LIVE:
        print(f"  Wallet:   {WALLET[:8]}...{WALLET[-4:]}")
    else:
        print("  Wallet:   disabled")
    print(f"  USDC.e:    ${balance:.4f}")
'''
          new_status = '''    print(f"  Mode:      {context.label}")
    print(f"  Wallet:    {WALLET[:8]}...{WALLET[-4:]}")
    print(f"  USDC.e:    ${balance:.4f}")
'''
          old_loop = '''    print("=" * 60)
    print(f"  Wallet:    {WALLET[:8]}...{WALLET[-4:]}")
    print(f"  Cities:   {len(LOCATIONS)}")
'''
          new_loop = '''    print("=" * 60)
    print(f"  Mode:     {context.label}")
    if context.mode is ExecutionMode.LIVE:
        print(f"  Wallet:   {WALLET[:8]}...{WALLET[-4:]}")
    else:
        print("  Wallet:   disabled")
    print(f"  Cities:   {len(LOCATIONS)}")
'''
          for old, new, label in (
              (old_status, new_status, "status"),
              (old_loop, new_loop, "run loop"),
          ):
              if content.count(old) != 1:
                  raise SystemExit(f"{label} marker count: {content.count(old)}")
              content = content.replace(old, new, 1)
          path.write_text(content, encoding="utf-8")
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot_v3.py
          git commit -m "fix: keep non-live loop wallet-free"
          git push origin HEAD:agent/execution-modes
