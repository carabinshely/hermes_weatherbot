name: Temporary issue 12 Weather Underground verification

on:
  push:
    branches:
      - agent/issue-12-calibrated-uncertainty

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/issue-12-calibrated-uncertainty
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - run: uv sync --locked --all-groups
      - name: Apply bounded default-policy fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("weatherbot/resolution/wunderground.py")
          text = path.read_text(encoding="utf-8")
          marker = "\n\n@dataclass(frozen=True, slots=True)\nclass WeatherUndergroundObservation:\n"
          replacement = (
              "\n\n_DEFAULT_COVERAGE_POLICY = WeatherUndergroundCoveragePolicy()"
              "\n\n\n@dataclass(frozen=True, slots=True)\nclass WeatherUndergroundObservation:\n"
          )
          if text.count(marker) != 1:
              raise SystemExit("coverage-policy insertion point is ambiguous")
          text = text.replace(marker, replacement)
          default = (
              "coverage_policy: WeatherUndergroundCoveragePolicy = "
              "WeatherUndergroundCoveragePolicy(),"
          )
          if text.count(default) != 2:
              raise SystemExit("expected two coverage-policy defaults")
          text = text.replace(
              default,
              "coverage_policy: WeatherUndergroundCoveragePolicy = _DEFAULT_COVERAGE_POLICY,",
          )
          path.write_text(text, encoding="utf-8")
          PY
      - run: uv run ruff check --fix weatherbot/resolution/wunderground.py tests/resolution/test_wunderground.py
      - run: uv run ruff format weatherbot/resolution/wunderground.py tests/resolution/test_wunderground.py
      - name: Verify strict typing before commit
        run: uv run pyright execution_modes.py runtime_security.py weatherbot tests
      - name: Verify resolution tests before commit
        run: PYTHONPATH=. uv run pytest -q tests/resolution tests/forecasting/test_calibration_data.py
      - name: Commit verified parser
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weatherbot/resolution/wunderground.py tests/resolution/test_wunderground.py
          git commit -m "Verify Weather Underground history parser"
          git push origin HEAD:agent/issue-12-calibrated-uncertainty
