name: Temporary issue 12 hygiene

on:
  push:
    branches:
      - agent/issue-12-calibrated-uncertainty

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/issue-12-calibrated-uncertainty
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - run: uv sync --locked --all-groups
      - name: Apply bounded calibration fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          calibration = Path("weatherbot/forecasting/calibration.py")
          text = calibration.read_text(encoding="utf-8")
          old = "from bisect import bisect_right"
          new = "from bisect import bisect_left"
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = "return bisect_right(self.residuals_f, residual) / len(self.residuals_f)"
          new = "return bisect_left(self.residuals_f, residual) / len(self.residuals_f)"
          assert text.count(old) == 1
          text = text.replace(old, new)
          calibration.write_text(text, encoding="utf-8")

          fit = Path("weatherbot/forecasting/calibration_fit.py")
          text = fit.read_text(encoding="utf-8")
          old = '''    pairwise_sum = 0.0
              for left in values:
                  for right in values:
                      pairwise_sum += abs(float(left - right))
              second = pairwise_sum / (2.0 * len(values) * len(values))
              return first - second'''.replace("              ", "")
          new = '''    n = len(values)
              unordered_pair_sum = sum(
                  (2 * index - n + 1) * float(value) for index, value in enumerate(values)
              )
              second = unordered_pair_sum / (n * n)
              return first - second'''.replace("              ", "")
          assert text.count(old) == 1
          text = text.replace(old, new)
          fit.write_text(text, encoding="utf-8")
          PY
      - run: uv run ruff check --fix weatherbot/forecasting/__init__.py weatherbot/forecasting/calibration.py weatherbot/forecasting/calibration_fit.py tests/forecasting/test_calibration.py tests/forecasting/test_calibration_fit.py tests/forecasting/test_calibration_semantics.py
      - run: uv run ruff format weatherbot/forecasting/__init__.py weatherbot/forecasting/calibration.py weatherbot/forecasting/calibration_fit.py tests/forecasting/test_calibration.py tests/forecasting/test_calibration_fit.py tests/forecasting/test_calibration_semantics.py
      - name: Commit hygiene output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weatherbot/forecasting/__init__.py weatherbot/forecasting/calibration.py weatherbot/forecasting/calibration_fit.py tests/forecasting/test_calibration.py tests/forecasting/test_calibration_fit.py tests/forecasting/test_calibration_semantics.py
          git commit -m "Fix issue 12 calibration hygiene"
          git push origin HEAD:agent/issue-12-calibrated-uncertainty
