name: Apply PR 53 Codex review fixes v2

on:
  push:
    branches:
      - agent/issue-48-calibrated-runtime-boundary
    paths:
      - .github/workflows/pr53-codex-fixes-v2.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v6
        with:
          ref: agent/issue-48-calibrated-runtime-boundary

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked development environment
        run: uv sync --locked --all-groups

      - name: Apply Codex fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              source = file_path.read_text(encoding="utf-8")
              if old not in source:
                  raise SystemExit(f"patch anchor not found in {path}: {old[:80]!r}")
              file_path.write_text(source.replace(old, new, 1), encoding="utf-8")

          contracts = Path("weatherbot/forecasting/contracts.py")
          if contracts.exists():
              raise SystemExit("calibration contracts module already exists")
          contracts.write_text(
              '''"""Dependency-light constants shared by calibration build and runtime code."""\n\nfrom __future__ import annotations\n\nOBSERVATION_CONTRACT_ID = (\n    "polymarket:wunderground:airport-daily-high:whole-degree-f:finalized-history:v1"\n)\nCALIBRATION_LEAD_DAYS: tuple[int, ...] = (0, 1, 2)\n''',
              encoding="utf-8",
          )

          replace_once(
              "weatherbot/forecasting/calibration_build.py",
              "from weatherbot.forecasting.calibration import CalibrationError\n",
              "from weatherbot.forecasting.calibration import CalibrationError\n"
              "from weatherbot.forecasting.contracts import (\n"
              "    CALIBRATION_LEAD_DAYS,\n"
              "    OBSERVATION_CONTRACT_ID,\n"
              ")\n",
          )
          replace_once(
              "weatherbot/forecasting/calibration_build.py",
              'OBSERVATION_CONTRACT_ID = (\n    "polymarket:wunderground:airport-daily-high:whole-degree-f:finalized-history:v1"\n)\n',
              "",
          )
          replace_once(
              "weatherbot/forecasting/calibration_build.py",
              "_DEFAULT_HORIZONS = (0, 1, 2)",
              "_DEFAULT_HORIZONS = CALIBRATION_LEAD_DAYS",
          )

          replace_once(
              "weatherbot/forecasting/runtime.py",
              "from weatherbot.forecasting.calibration_build import OBSERVATION_CONTRACT_ID\n",
              "from weatherbot.forecasting.contracts import (\n"
              "    CALIBRATION_LEAD_DAYS,\n"
              "    OBSERVATION_CONTRACT_ID,\n"
              ")\n",
          )
          replace_once(
              "weatherbot/forecasting/runtime.py",
              "    ) -> CalibratedProbability:\n        estimate = self.model.probability(\n",
              "    ) -> CalibratedProbability:\n"
              "        if lead_days not in CALIBRATION_LEAD_DAYS:\n"
              "            raise CalibrationCompatibilityError(\n"
              "                f\"lead_days={lead_days} is outside calibrated lead set \"\n"
              "                f\"{CALIBRATION_LEAD_DAYS}\"\n"
              "            )\n"
              "        estimate = self.model.probability(\n",
          )

          replace_once(
              "bot_v3.py",
              "import sys\nimport time\n",
              "import json\nimport os\nimport sys\nimport time\n",
          )
          replace_once(
              "bot_v3.py",
              "import bot_v3_legacy as _legacy\nfrom bot_v3_legacy import *  # noqa: F403\n",
              "import bot_v3_legacy as _legacy\n",
          )
          replace_once(
              "bot_v3.py",
              "from weatherbot.forecasting.calibration import CalibrationError\n",
              "from weatherbot.forecasting.calibration import CalibrationError\n"
              "from weatherbot.forecasting.contracts import CALIBRATION_LEAD_DAYS\n",
          )
          replace_once(
              "bot_v3.py",
              "PAPER_RUNTIME = _legacy.PAPER_RUNTIME\nC = _legacy.C\n\n\ndef tg_scan_summary(\n",
              "PAPER_RUNTIME = _legacy.PAPER_RUNTIME\n"
              "C = _legacy.C\n"
              "RESEARCH_SIGNAL_LOG = BOT_DIR / \"state\" / \"research-signals.jsonl\"\n\n\n"
              "def persist_research_signal(signal: dict[str, object]) -> None:\n"
              "    \"\"\"Append one complete research signal with provenance to durable local history.\"\"\"\n"
              "    RESEARCH_SIGNAL_LOG.parent.mkdir(parents=True, exist_ok=True)\n"
              "    encoded = json.dumps(\n"
              "        signal,\n"
              "        sort_keys=True,\n"
              "        separators=(\",\", \":\"),\n"
              "        ensure_ascii=False,\n"
              "        default=str,\n"
              "    )\n"
              "    with RESEARCH_SIGNAL_LOG.open(\"a\", encoding=\"utf-8\") as handle:\n"
              "        handle.write(encoded + \"\\n\")\n"
              "        handle.flush()\n"
              "        os.fsync(handle.fileno())\n\n\n"
              "def tg_scan_summary(\n",
          )
          replace_once(
              "bot_v3.py",
              "calendar.candidate_dates(now, count=4)",
              "calendar.candidate_dates(now, count=len(CALIBRATION_LEAD_DAYS))",
          )
          replace_once(
              "bot_v3.py",
              "        for horizon_index, market_date in enumerate(dates):\n",
              "        for horizon_index, market_date in zip(\n"
              "            CALIBRATION_LEAD_DAYS, dates, strict=True\n"
              "        ):\n",
          )
          replace_once(
              "bot_v3.py",
              "            top_signals.append(\n",
              "            try:\n"
              "                persist_research_signal(signal)\n"
              "            except (OSError, TypeError, ValueError) as exc:\n"
              "                errors.append(\n"
              "                    f\"{loc['name']} {horizon}: research signal persistence failed: {exc}\"\n"
              "                )\n"
              "                continue\n"
              "            top_signals.append(\n",
          )
          replace_once("bot_v3.py", "            _ = signal\n", "")

          replace_once(
              "tests/forecasting/test_calibration_runtime.py",
              "from weatherbot.forecasting.calibration_build import OBSERVATION_CONTRACT_ID\n",
              "from weatherbot.forecasting.contracts import (\n"
              "    CALIBRATION_LEAD_DAYS,\n"
              "    OBSERVATION_CONTRACT_ID,\n"
              ")\n",
          )
          runtime_test = Path("tests/forecasting/test_calibration_runtime.py")
          runtime_source = runtime_test.read_text(encoding="utf-8")
          runtime_source += '''\n\ndef test_runtime_rejects_lead_days_outside_frozen_dataset(tmp_path: Path) -> None:\n    _approved_repository(tmp_path)\n    runtime = load_calibrated_probability_runtime(repository_root=tmp_path)\n    weather = weather_snapshot()\n    bucket = TemperatureBucket.bounded(86, 86, TemperatureUnit.FAHRENHEIT)\n\n    with pytest.raises(CalibrationCompatibilityError, match="outside calibrated lead set"):\n        runtime.probability(\n            city="chicago",\n            climate_region="ohio_valley",\n            lead_days=max(CALIBRATION_LEAD_DAYS) + 1,\n            weather=weather,\n            bucket=bucket,\n        )\n'''
          runtime_test.write_text(runtime_source, encoding="utf-8")

          minimal = Path("tests/test_minimal_import_boundary.py")
          minimal_source = minimal.read_text(encoding="utf-8")
          minimal_source = minimal_source.replace(
              "import importlib\nimport sys\n",
              "import importlib\nimport subprocess\nimport sys\n",
              1,
          )
          minimal_source += '''\n\ndef test_paper_imports_in_a_cold_process() -> None:\n    completed = subprocess.run(\n        [sys.executable, "-c", "import weatherbot.paper"],\n        check=False,\n        capture_output=True,\n        text=True,\n        timeout=30,\n    )\n    assert completed.returncode == 0, completed.stderr\n'''
          minimal.write_text(minimal_source, encoding="utf-8")

          bot_source_test = Path("tests/forecasting/test_bot_source.py")
          bot_test_source = bot_source_test.read_text(encoding="utf-8")
          bot_test_source += '''\n\ndef test_public_scanner_does_not_reexport_quarantined_helpers() -> None:\n    bot_source = Path("bot_v3.py").read_text(encoding="utf-8")\n\n    assert "from bot_v3_legacy import *" not in bot_source\n    assert "count=len(CALIBRATION_LEAD_DAYS)" in bot_source\n    assert "zip(" in bot_source and "CALIBRATION_LEAD_DAYS, dates, strict=True" in bot_source\n    assert "persist_research_signal(signal)" in bot_source\n    assert "_ = signal" not in bot_source\n'''
          bot_source_test.write_text(bot_test_source, encoding="utf-8")

          gate_test = Path("tests/forecasting/test_calibrated_scanner_gate.py")
          gate_source = gate_test.read_text(encoding="utf-8")
          gate_source = gate_source.replace("import pytest\n", "import json\n\nimport pytest\n", 1)
          gate_source += '''\n\ndef test_public_entrypoint_does_not_expose_quarantined_strategy_primitives() -> None:\n    for name in (\n        "SIGMA_F",\n        "get_sigma",\n        "bucket_prob",\n        "ensure_approvals",\n        "place_buy_order",\n    ):\n        assert not hasattr(bot_v3, name)\n\n\ndef test_research_signal_log_preserves_complete_calibration_provenance(\n    tmp_path: Path, monkeypatch: pytest.MonkeyPatch\n) -> None:\n    log_path = tmp_path / "research-signals.jsonl"\n    monkeypatch.setattr(bot_v3, "RESEARCH_SIGNAL_LOG", log_path)\n    signal = {\n        "model_probability": "0.427",\n        "model_version": "issue12-v3-fixture",\n        "artifact_sha256": "a" * 64,\n        "forecast_source": "open_meteo_ecmwf_ifs025",\n        "calibration_group_key": "source|open_meteo_ecmwf_ifs025",\n        "fallback_level": "source",\n        "distribution_type": "normal",\n        "calibration_sample_count": 60,\n        "training_cutoff": "2026-08-10",\n    }\n\n    bot_v3.persist_research_signal(signal)\n\n    assert json.loads(log_path.read_text(encoding="utf-8")) == signal\n'''
          gate_source = gate_source.replace(
              "import json\n\nimport pytest\n",
              "import json\nfrom pathlib import Path\n\nimport pytest\n",
              1,
          )
          gate_test.write_text(gate_source, encoding="utf-8")

          docs = Path("docs/forecast-calibration.md")
          docs_source = docs.read_text(encoding="utf-8")
          docs_source += '''\n\n### Runtime lead-domain and RESEARCH evidence\n\nThe frozen calibration dataset supports only D+0, D+1, and D+2. Runtime probability evaluation rejects any other lead instead of falling through to a broader group trained on a different lead domain. The RESEARCH scanner requests exactly those supported horizons.\n\nEvery emitted RESEARCH signal is appended to `state/research-signals.jsonl` before it is reported as an observed signal. Each JSON line retains the weather snapshot metadata, complete calibration provenance (`model_version`, `artifact_sha256`, `forecast_source`, `calibration_group_key`, `fallback_level`, `distribution_type`, `calibration_sample_count`, `training_cutoff`, and `model_probability`), and validated quote metadata. Persistence failure rejects that candidate rather than emitting unauditable research evidence.\n'''
          docs.write_text(docs_source, encoding="utf-8")
          PY

      - name: Format and lint changed Python
        run: |
          uv run ruff check --fix bot_v3.py weatherbot/forecasting/contracts.py weatherbot/forecasting/runtime.py weatherbot/forecasting/calibration_build.py tests/forecasting/test_calibration_runtime.py tests/forecasting/test_bot_source.py tests/forecasting/test_calibrated_scanner_gate.py tests/test_minimal_import_boundary.py
          uv run ruff format \
            bot_v3.py \
            weatherbot/forecasting/contracts.py \
            weatherbot/forecasting/runtime.py \
            weatherbot/forecasting/calibration_build.py \
            tests/forecasting/test_calibration_runtime.py \
            tests/forecasting/test_bot_source.py \
            tests/forecasting/test_calibrated_scanner_gate.py \
            tests/test_minimal_import_boundary.py
          uv run ruff check \
            bot_v3.py \
            weatherbot/forecasting/contracts.py \
            weatherbot/forecasting/runtime.py \
            weatherbot/forecasting/calibration_build.py \
            tests/forecasting/test_calibration_runtime.py \
            tests/forecasting/test_bot_source.py \
            tests/forecasting/test_calibrated_scanner_gate.py \
            tests/test_minimal_import_boundary.py

      - name: Type-check maintained code
        run: uv run pyright execution_modes.py runtime_security.py weatherbot tests

      - name: Run focused regression tests
        run: |
          uv run pytest -q \
            tests/forecasting/test_calibration_runtime.py \
            tests/forecasting/test_bot_source.py \
            tests/forecasting/test_calibrated_scanner_gate.py \
            tests/test_minimal_import_boundary.py \
            tests/test_execution_modes.py

      - name: Run full test suite
        run: uv run pytest -q

      - name: Commit verified Codex fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            bot_v3.py \
            docs/forecast-calibration.md \
            weatherbot/forecasting/contracts.py \
            weatherbot/forecasting/runtime.py \
            weatherbot/forecasting/calibration_build.py \
            tests/forecasting/test_calibration_runtime.py \
            tests/forecasting/test_bot_source.py \
            tests/forecasting/test_calibrated_scanner_gate.py \
            tests/test_minimal_import_boundary.py
          git commit -m "Address Codex review findings on calibrated runtime"
          git push origin HEAD:agent/issue-48-calibrated-runtime-boundary
