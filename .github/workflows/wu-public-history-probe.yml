name: Temporary issue 12 Weather Underground public-history probe

on:
  push:
    branches:
      - agent/issue-12-calibrated-uncertainty

permissions:
  contents: read

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Inspect canonical public daily-history response
        run: |
          python - <<'PY'
          import gzip
          import hashlib
          import json
          import re
          import urllib.error
          import urllib.request

          url = "https://www.wunderground.com/history/daily/us/ny/new-york-city/KLGA/date/2026-4-18"
          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": (
                      "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                      "(KHTML, like Gecko) Chrome/151.0 Safari/537.36"
                  ),
                  "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
                  "Accept-Language": "en-US,en;q=0.9",
                  "Accept-Encoding": "gzip",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  raw = response.read()
                  headers = dict(response.headers.items())
                  final_url = response.geturl()
                  status = response.status
          except urllib.error.HTTPError as exc:
              body = exc.read()
              print(
                  "HTTP_ERROR "
                  + json.dumps(
                      {
                          "status": exc.code,
                          "final_url": exc.geturl(),
                          "headers": dict(exc.headers.items()),
                          "body_prefix": body[:1000].decode("utf-8", errors="replace"),
                      },
                      sort_keys=True,
                  )
              )
              raise

          if headers.get("Content-Encoding", "").lower() == "gzip":
              raw = gzip.decompress(raw)
          text = raw.decode("utf-8", errors="replace")
          normalized = re.sub(r"\s+", " ", text)
          needles = (
              "High Temp",
              "KLGA",
              "LaGuardia",
              "2026-04-18",
              "55",
              "__NEXT_DATA__",
              "application/ld+json",
              "history-daily",
          )
          print(
              "RESPONSE "
              + json.dumps(
                  {
                      "status": status,
                      "final_url": final_url,
                      "content_type": headers.get("Content-Type"),
                      "content_length": len(raw),
                      "sha256": hashlib.sha256(raw).hexdigest(),
                      "needle_presence": {needle: needle in text for needle in needles},
                      "title": (
                          re.search(r"<title[^>]*>(.*?)</title>", text, re.I | re.S).group(1)
                          if re.search(r"<title[^>]*>(.*?)</title>", text, re.I | re.S)
                          else None
                      ),
                  },
                  sort_keys=True,
              )
          )

          for needle in ("High Temp", "KLGA", "LaGuardia", "__NEXT_DATA__"):
              index = normalized.find(needle)
              if index >= 0:
                  start = max(0, index - 500)
                  end = min(len(normalized), index + 1500)
                  print(f"CONTEXT {needle}: " + normalized[start:end])

          # Inspect common embedded JSON script blocks without printing the full page.
          for script_type in ("application/ld+json", "application/json"):
              matches = re.findall(
                  rf'<script[^>]+type=["\']{re.escape(script_type)}["\'][^>]*>(.*?)</script>',
                  text,
                  re.I | re.S,
              )
              print(f"SCRIPT_COUNT {script_type}: {len(matches)}")
              for index, payload in enumerate(matches[:5]):
                  compact = re.sub(r"\s+", " ", payload)[:3000]
                  print(f"SCRIPT {script_type} {index}: {compact}")
          PY
