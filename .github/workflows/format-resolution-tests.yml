name: Format resolution tests

on:
  push:
    branches: [agent/resolution-foundation]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/resolution-foundation

      - name: Format new test
        run: |
          python -m pip install --quiet ruff==0.15.22
          ruff format tests/markets/test_bot_integration_source.py

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/markets/test_bot_integration_source.py
          git commit -m "style: format scanner integration test"
          git push origin HEAD:agent/resolution-foundation
