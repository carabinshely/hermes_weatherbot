name: Fix dependency test imports

on:
  push:
    branches: [agent/minimal-runtime-dependencies]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/minimal-runtime-dependencies

      - name: Apply Ruff import fix
        run: |
          python -m pip install --quiet ruff==0.15.22
          ruff check --fix tests/test_dependency_profile_docs.py
          ruff format tests/test_dependency_profile_docs.py
          ruff check tests/test_dependency_profile_docs.py
          ruff format --check tests/test_dependency_profile_docs.py

      - name: Commit canonical imports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_dependency_profile_docs.py
          git commit -m "style: normalize dependency profile test imports"
          git push origin HEAD:agent/minimal-runtime-dependencies
