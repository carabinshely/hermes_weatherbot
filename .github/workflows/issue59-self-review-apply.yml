name: Apply validated issue 59 review patch

on:
  push:
    branches:
      - agent/issue-59-paper-rnd
    paths:
      - .github/workflows/issue59-self-review-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/issue-59-paper-rnd
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: uv sync --locked --all-groups
      - name: Reuse validated patch generator
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path(".github/workflows/issue59-self-review-fix-v2.yml").read_text(
              encoding="utf-8"
          )
          start = "          python - <<'PY'\n"
          end = "          PY\n"
          block = source.split(start, 1)[1].split(end, 1)[0]
          code = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in block.splitlines()
          )
          exec(compile(code, "issue59-review-patch", "exec"), {})
          PY
          uv run ruff format weatherbot/paper/experiment.py tests/paper/test_experiment.py
          uv run ruff check weatherbot/paper/experiment.py tests/paper/test_experiment.py
          uv run pyright weatherbot/paper/experiment.py tests/paper/test_experiment.py
          PYTHONPATH=. uv run pytest -q tests/paper/test_experiment.py
      - name: Commit reviewed fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weatherbot/paper/experiment.py tests/paper/test_experiment.py README.md
          git commit -m "fix: prevent PAPER replay look-ahead bias"
          git push origin HEAD:agent/issue-59-paper-rnd
