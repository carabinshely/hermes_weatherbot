name: Patch forecast observation boundary

on:
  push:
    branches: [agent/separate-forecast-observation]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/separate-forecast-observation

      - name: Apply scoped scanner patch
        run: python tools/patch_forecast_observation_boundary.py

      - name: Format maintained files
        run: |
          python -m pip install --quiet ruff==0.15.22
          ruff check --fix weatherbot/forecasting tests/forecasting
          ruff format weatherbot/forecasting tests/forecasting
          python -m compileall -q weatherbot/forecasting tests/forecasting bot_v3.py

      - name: Commit weather boundary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot_v3.py weatherbot/forecasting tests/forecasting docs/weather-data-policy.md
          git commit -m "fix: separate daily forecast from METAR observation"
          git push origin HEAD:agent/separate-forecast-observation
