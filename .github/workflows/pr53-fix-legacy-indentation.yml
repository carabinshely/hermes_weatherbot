name: Fix PR 53 legacy guard indentation

on:
  push:
    branches:
      - agent/issue-48-calibrated-runtime-boundary
    paths:
      - .github/workflows/pr53-fix-legacy-indentation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v6
        with:
          ref: agent/issue-48-calibrated-runtime-boundary

      - name: Repair and verify legacy CLI guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("bot_v3_legacy.py")
          source = path.read_text(encoding="utf-8")
          bad = "\n".join(
              [
                  '    if args.command in {"scan", "run"}:',
                  '    print(',
                  '        "ERROR: legacy strategy scanning is disabled; use bot_v3.py",',
                  '        file=sys.stderr,',
                  '    )',
                  '    return 2',
                  '',
              ]
          )
          good = "\n".join(
              [
                  '    if args.command in {"scan", "run"}:',
                  '        print(',
                  '            "ERROR: legacy strategy scanning is disabled; use bot_v3.py",',
                  '            file=sys.stderr,',
                  '        )',
                  '        return 2',
                  '',
              ]
          )
          if bad not in source:
              raise SystemExit("malformed legacy guard anchor not found")
          path.write_text(source.replace(bad, good, 1), encoding="utf-8")
          PY

          python -m py_compile bot_v3_legacy.py
          set +e
          output="$(python bot_v3_legacy.py scan --mode research 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 2
          grep -F 'legacy strategy scanning is disabled' <<<"$output"

      - name: Commit verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot_v3_legacy.py
          git commit -m "Fix quarantined legacy strategy guard"
          git push origin HEAD:agent/issue-48-calibrated-runtime-boundary
