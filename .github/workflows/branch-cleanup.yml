name: Temporary branch workflow cleanup

on:
  push:
    branches:
      - agent/issue-12-calibrated-uncertainty

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/issue-12-calibrated-uncertainty
      - name: Remove temporary workflows
        run: |
          git rm .github/workflows/branch-archive-verify.yml .github/workflows/branch-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary archive verification workflows"
          git push origin HEAD:agent/issue-12-calibrated-uncertainty
