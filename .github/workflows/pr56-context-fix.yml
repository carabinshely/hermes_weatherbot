name: Verify PR 56 context binding
on:
  push:
    branches: [agent/issue-48b-calibrated-paper]
    paths: [.github/workflows/pr56-context-fix.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/issue-48b-calibrated-paper
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --all-groups
      - name: Apply context binding fix
        run: python scripts/pr56_codex_context_fix.py
      - name: Quality gates
        run: |
          uv run ruff check --fix bot_v3.py weatherbot tests
          uv run ruff format bot_v3.py weatherbot tests
          uv run ruff check execution_modes.py runtime_security.py weatherbot tests
          uv run pyright execution_modes.py runtime_security.py weatherbot tests
      - name: Focused tests
        run: PYTHONPATH=. uv run pytest -q tests/forecasting/test_calibration_runtime.py tests/paper/test_calibrated_integration.py tests/forecasting/test_calibrated_scanner_gate.py tests/paper/test_runtime.py tests/paper/test_service.py
      - name: Full suite
        run: PYTHONPATH=. uv run pytest -q
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weatherbot/forecasting/runtime.py weatherbot/paper/integration.py tests/paper/helpers.py tests/paper/test_calibrated_integration.py tests/forecasting/test_calibration_runtime.py
          git diff --cached --quiet && exit 0
          git commit -m "Bind calibrated probability to weather decision context"
          git push origin HEAD:agent/issue-48b-calibrated-paper
