name: Temporary issue 12 phase A verification

on:
  push:
    branches:
      - agent/issue-12-calibrated-uncertainty

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/issue-12-calibrated-uncertainty
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - run: uv sync --locked --all-groups
      - name: Apply bounded Phase A fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match, found {count}: {old!r}")
              return text.replace(old, new)

          module = Path("weatherbot/forecasting/calibration_data.py")
          text = module.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "def _decimal(value: Decimal | int | str | float, *, label: str) -> Decimal:\n",
              "def _integer(value: object, *, label: str) -> int:\n"
              "    if isinstance(value, bool) or not isinstance(value, int):\n"
              "        raise CalibrationError(f\"{label} must be an integer\")\n"
              "    return value\n\n\n"
              "def _boolean(value: object, *, label: str) -> bool:\n"
              "    if not isinstance(value, bool):\n"
              "        raise CalibrationError(f\"{label} must be boolean\")\n"
              "    return value\n\n\n"
              "def _decimal(value: Decimal | int | str | float, *, label: str) -> Decimal:\n",
          )
          text = replace_once(
              text,
              "        if isinstance(self.bias_correction, bool) is False:\n"
              "            raise CalibrationError(\"bias_correction must be boolean\")\n",
              "        bias_correction = _boolean(self.bias_correction, label=\"bias_correction\")\n",
          )
          text = replace_once(
              text,
              "        if isinstance(self.lead_days, bool) or not isinstance(self.lead_days, int):\n"
              "            raise CalibrationError(\"forecast lead_days must be an integer\")\n",
              "        _integer(self.lead_days, label=\"forecast lead_days\")\n",
          )
          text = replace_once(
              text,
              "        object.__setattr__(self, \"payload_sha256\", payload_hash)\n",
              "        object.__setattr__(self, \"bias_correction\", bias_correction)\n"
              "        object.__setattr__(self, \"payload_sha256\", payload_hash)\n",
          )
          text = replace_once(
              text,
              "        if isinstance(self.min_pairs, bool) or not isinstance(self.min_pairs, int):\n"
              "            raise CalibrationError(\"parity min_pairs must be an integer\")\n",
              "        _integer(self.min_pairs, label=\"parity min_pairs\")\n",
          )
          text = replace_once(
              text,
              "        for label, value in (\n"
              "            (\"reference_count\", self.reference_count),\n"
              "            (\"candidate_count\", self.candidate_count),\n"
              "            (\"matched_count\", self.matched_count),\n"
              "        ):\n"
              "            if isinstance(value, bool) or not isinstance(value, int) or value < 0:\n"
              "                raise CalibrationError(f\"parity {label} must be a non-negative integer\")\n",
              "        for label, value in (\n"
              "            (\"reference_count\", self.reference_count),\n"
              "            (\"candidate_count\", self.candidate_count),\n"
              "            (\"matched_count\", self.matched_count),\n"
              "        ):\n"
              "            _integer(value, label=f\"parity {label}\")\n"
              "            if value < 0:\n"
              "                raise CalibrationError(f\"parity {label} must be non-negative\")\n",
          )
          text = replace_once(
              text,
              "        if isinstance(self.forecast_bias_correction, bool) is False:\n"
              "            raise CalibrationError(\"dataset forecast_bias_correction must be boolean\")\n",
              "        bias_correction = _boolean(\n"
              "            self.forecast_bias_correction,\n"
              "            label=\"dataset forecast_bias_correction\",\n"
              "        )\n",
          )
          text = replace_once(
              text,
              "        object.__setattr__(\n"
              "            self,\n"
              "            \"forecast_provenance_sha256\",\n",
              "        object.__setattr__(self, \"forecast_bias_correction\", bias_correction)\n"
              "        object.__setattr__(\n"
              "            self,\n"
              "            \"forecast_provenance_sha256\",\n",
          )
          text = replace_once(
              text,
              "        if forecast.capture_contract_id != effective_contract:\n"
              "            if forecast.capture_contract_id not in accepted_archive_contracts:\n"
              "                raise CalibrationError(\n"
              "                    \"archive forecast cannot enter the dataset without passing source parity\"\n"
              "                )\n",
              "        if (\n"
              "            forecast.capture_contract_id != effective_contract\n"
              "            and forecast.capture_contract_id not in accepted_archive_contracts\n"
              "        ):\n"
              "            raise CalibrationError(\n"
              "                \"archive forecast cannot enter the dataset without passing source parity\"\n"
              "            )\n",
          )
          module.write_text(text, encoding="utf-8")

          tests = Path("tests/forecasting/test_calibration_data.py")
          text = tests.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "from datetime import UTC, date, datetime, time, timedelta\n",
              "from datetime import UTC, date, datetime, time, timedelta\nfrom pathlib import Path\n",
          )
          text = replace_once(
              text,
              "    ArchiveParityPolicy,\n",
              "    ArchiveParityPolicy,\n    ArchiveParityReport,\n",
          )
          text = replace_once(
              text,
              "def _passing_parity_report() -> object:\n",
              "def _passing_parity_report() -> ArchiveParityReport:\n",
          )
          text = replace_once(
              text,
              "            payload_character=chr(ord(\"e\") + index),\n",
              "            payload_character=(\"1\", \"2\", \"3\", \"4\")[index],\n",
          )
          text = replace_once(
              text,
              "def test_dataset_hash_and_manifest_are_independent_of_input_order(tmp_path: object) -> None:\n"
              "    from pathlib import Path\n\n"
              "    assert isinstance(tmp_path, Path)\n",
              "def test_dataset_hash_and_manifest_are_independent_of_input_order(tmp_path: Path) -> None:\n",
          )
          tests.write_text(text, encoding="utf-8")
          PY
      - run: uv run ruff check --fix weatherbot/forecasting/calibration_data.py tests/forecasting/test_calibration_data.py
      - run: uv run ruff format weatherbot/forecasting/calibration_data.py tests/forecasting/test_calibration_data.py
      - name: Verify strict typing before commit
        run: uv run pyright execution_modes.py runtime_security.py weatherbot tests
      - name: Verify all calibration tests before commit
        run: PYTHONPATH=. uv run pytest -q tests/forecasting/test_calibration.py tests/forecasting/test_calibration_fit.py tests/forecasting/test_calibration_semantics.py tests/forecasting/test_calibration_data.py
      - name: Commit verified Phase A fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weatherbot/forecasting/calibration_data.py tests/forecasting/test_calibration_data.py
          git commit -m "Fix issue 12 calibration dataset typing"
          git push origin HEAD:agent/issue-12-calibrated-uncertainty
