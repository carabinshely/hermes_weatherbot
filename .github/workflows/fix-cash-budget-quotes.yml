name: Fix cash-budget quotes

on:
  push:
    branches: [agent/resolution-foundation]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/resolution-foundation

      - name: Apply budget-safe quote patch
        run: python tools/fix_cash_budget_quotes.py

      - name: Validate focused behavior
        run: |
          python -m pip install --quiet uv==0.11.33
          uv sync --locked --all-groups
          uv run ruff check --fix weatherbot/markets tests/markets
          uv run ruff check --select E9,F63,F7,F82 bot_v3.py
          uv run ruff format weatherbot/markets tests/markets bot_v3.py
          uv run pyright weatherbot/markets tests/markets
          uv run pytest -q tests/markets tests/polymarket tests/test_legacy_math.py
          uv run python -m compileall -q weatherbot bot_v3.py

      - name: Commit budget-safe quotes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weatherbot/markets/orderbook.py bot_v3.py tests/markets/test_orderbook.py tests/markets/test_bot_integration_source.py
          git commit -m "fix: cap executable quotes by cash budget"
          git push origin HEAD:agent/resolution-foundation
