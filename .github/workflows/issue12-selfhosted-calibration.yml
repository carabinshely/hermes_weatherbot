name: Issue 12 self-hosted calibration

on:
  workflow_dispatch:
  push:
    branches:
      - agent/issue-12-calibrated-uncertainty
      - agent/issue-47-v3-policy
    paths:
      - .github/workflows/issue12-selfhosted-calibration.yml

permissions:
  contents: read

concurrency:
  group: issue12-selfhosted-calibration-isolated-v2
  cancel-in-progress: false

jobs:
  calibrate-v2-history:
    if: github.ref == 'refs/heads/agent/issue-12-calibrated-uncertainty'
    name: Reproduce historical calibration v2
    runs-on: hermes-weather-calibration
    timeout-minutes: 180

    steps:
      - name: Preserve reusable calibration cache before checkout
        shell: bash
        run: |
          set -euo pipefail
          persistent_cache="$(dirname "$(dirname "$GITHUB_WORKSPACE")")/issue12-calibration-cache"
          legacy_cache="$GITHUB_WORKSPACE/data/calibration/issue12-v1/cache"
          mkdir -p "$persistent_cache"
          if [ -d "$legacy_cache" ]; then
            cp -a -n "$legacy_cache/." "$persistent_cache/"
          fi
          echo "ISSUE12_CACHE_DIR=$persistent_cache" >> "$GITHUB_ENV"
          printf 'preserved cache files: '
          find "$persistent_cache" -type f | wc -l
          du -sh "$persistent_cache"

      - name: Check out calibration branch
        uses: actions/checkout@v6
        with:
          ref: agent/issue-12-calibrated-uncertainty
          clean: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked Python 3.12 environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .venv
          uv sync --locked --all-groups --python "$(command -v python)"

      - name: Verify calibration interpreter contract
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. uv run python - <<'PY'
          import sys

          print(sys.version)
          if sys.version_info[:2] != (3, 12):
              raise SystemExit(f"calibration requires Python 3.12, got {sys.version_info[:2]}")
          PY

      - name: Collect corrected calibration dataset from preserved cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/calibration/issue12-v2
          PYTHONPATH=. uv run python -m weatherbot.forecasting.calibration_retry \
            --max-attempts 3 \
            --retry-backoff-seconds 10 \
            --request-max-attempts 4 \
            --request-retry-backoff-seconds 3 \
            -- \
            --start-date 2026-04-05 \
            --end-date 2026-08-10 \
            --cache-dir "$ISSUE12_CACHE_DIR" \
            --records-out data/calibration/issue12-v2/dataset.jsonl \
            --manifest-out data/calibration/issue12-v2/dataset-manifest.json \
            --exclusions-out data/calibration/issue12-v2/dataset-exclusions.json \
            --parity-evidence tests/fixtures/forecasting/ecmwf_single_run_parity_2026-04-18.json \
            --unavailable-runs-evidence tests/fixtures/forecasting/open_meteo_unavailable_runs_2026-08-13.json \
            --timeout-seconds 30 \
            --request-delay-seconds 1.0

      - name: Verify byte-identical offline replay
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. uv run python -m weatherbot.forecasting.calibration_sparse_sweep \
            --start-date 2026-04-05 \
            --end-date 2026-08-10 \
            --cache-dir "$ISSUE12_CACHE_DIR" \
            --records-out data/calibration/issue12-v2/dataset-offline.jsonl \
            --manifest-out data/calibration/issue12-v2/dataset-manifest-offline.json \
            --exclusions-out data/calibration/issue12-v2/dataset-exclusions-offline.json \
            --parity-evidence tests/fixtures/forecasting/ecmwf_single_run_parity_2026-04-18.json \
            --unavailable-runs-evidence tests/fixtures/forecasting/open_meteo_unavailable_runs_2026-08-13.json \
            --offline
          cmp data/calibration/issue12-v2/dataset.jsonl data/calibration/issue12-v2/dataset-offline.jsonl
          cmp data/calibration/issue12-v2/dataset-manifest.json data/calibration/issue12-v2/dataset-manifest-offline.json
          cmp data/calibration/issue12-v2/dataset-exclusions.json data/calibration/issue12-v2/dataset-exclusions-offline.json

      - name: Reproduce issue12-v2 historical development evaluation
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. uv run python -m weatherbot.forecasting.calibration_train \
            --records data/calibration/issue12-v2/dataset.jsonl \
            --manifest data/calibration/issue12-v2/dataset-manifest.json \
            --model-version issue12-v2 \
            --created-at-utc 2026-08-13T15:45:00Z \
            --training-end 2026-07-13 \
            --validation-start 2026-07-14 \
            --validation-end 2026-08-10 \
            --min-sample-count 30 \
            --artifact-out data/calibration/issue12-v2/calibration-artifact.json \
            --report-out data/calibration/issue12-v2/holdout-report.json

      - name: Print historical evidence summary
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          wc -l data/calibration/issue12-v2/dataset.jsonl
          sha256sum \
            data/calibration/issue12-v2/dataset.jsonl \
            data/calibration/issue12-v2/dataset-manifest.json \
            data/calibration/issue12-v2/dataset-exclusions.json \
            data/calibration/issue12-v2/calibration-artifact.json \
            data/calibration/issue12-v2/holdout-report.json
          du -sh "$ISSUE12_CACHE_DIR"
          printf '%s\n' '--- exclusion report ---'
          uv run python -m json.tool data/calibration/issue12-v2/dataset-exclusions.json
          printf '%s\n' '--- historical development report ---'
          uv run python -m json.tool data/calibration/issue12-v2/holdout-report.json

      - name: Upload normalized historical calibration evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: issue12-calibration-evidence-v2
          if-no-files-found: error
          retention-days: 30
          path: |
            data/calibration/issue12-v2/dataset.jsonl
            data/calibration/issue12-v2/dataset-manifest.json
            data/calibration/issue12-v2/dataset-exclusions.json
            data/calibration/issue12-v2/calibration-artifact.json
            data/calibration/issue12-v2/holdout-report.json

  replay-v3-development:
    if: github.ref == 'refs/heads/agent/issue-47-v3-policy'
    name: Replay frozen V3 development evidence
    runs-on: hermes-weather-calibration
    timeout-minutes: 30

    steps:
      - name: Preserve frozen normalized inputs before checkout
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$GITHUB_WORKSPACE/data/calibration/issue12-v2"
          persistent_input="$(dirname "$(dirname "$GITHUB_WORKSPACE")")/issue47-v3-replay-input"
          test -f "$source_dir/dataset.jsonl"
          test -f "$source_dir/dataset-manifest.json"
          test -f "$source_dir/dataset-exclusions.json"
          rm -rf "$persistent_input"
          mkdir -p "$persistent_input"
          cp "$source_dir/dataset.jsonl" "$persistent_input/dataset.jsonl"
          cp "$source_dir/dataset-manifest.json" "$persistent_input/dataset-manifest.json"
          cp "$source_dir/dataset-exclusions.json" "$persistent_input/dataset-exclusions.json"
          echo "ISSUE47_INPUT_DIR=$persistent_input" >> "$GITHUB_ENV"

      - name: Check out Issue 47 branch
        uses: actions/checkout@v6
        with:
          ref: agent/issue-47-v3-policy
          clean: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked Python 3.12 environment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .venv
          uv sync --locked --all-groups --python "$(command -v python)"

      - name: Quarantine final holdout and verify frozen input contract
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. uv run python - <<'PY'
          from datetime import date
          from os import environ
          from pathlib import Path

          from weatherbot.forecasting.calibration_io import load_calibration_dataset

          root = Path(environ["ISSUE47_INPUT_DIR"])
          dataset = load_calibration_dataset(
              root / "dataset.jsonl",
              root / "dataset-manifest.json",
          )
          if dataset.manifest.start_date != date(2026, 4, 5):
              raise SystemExit(f"unexpected dataset start: {dataset.manifest.start_date}")
          if dataset.manifest.end_date != date(2026, 8, 10):
              raise SystemExit(f"unexpected dataset end: {dataset.manifest.end_date}")
          latest = max(sample.market_date for sample in dataset.samples)
          if latest > date(2026, 8, 10):
              raise SystemExit(f"final holdout contamination detected: {latest}")
          print(f"record_count={len(dataset.samples)}")
          print(f"start_date={dataset.manifest.start_date}")
          print(f"end_date={dataset.manifest.end_date}")
          print(f"dataset_sha256={dataset.manifest.dataset_sha256}")
          print(f"manifest_sha256={dataset.manifest.manifest_sha256}")
          PY
          sha256sum \
            "$ISSUE47_INPUT_DIR/dataset.jsonl" \
            "$ISSUE47_INPUT_DIR/dataset-manifest.json" \
            "$ISSUE47_INPUT_DIR/dataset-exclusions.json"

      - name: Run V3 development replay twice
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/issue47-v3-development"
          rm -rf "$out"
          mkdir -p "$out"
          created_at="2026-08-14T05:50:00Z"
          for run in 1 2; do
            PYTHONPATH=. uv run python -m weatherbot.forecasting.calibration_v3_train \
              --records "$ISSUE47_INPUT_DIR/dataset.jsonl" \
              --manifest "$ISSUE47_INPUT_DIR/dataset-manifest.json" \
              --evaluation-kind development \
              --model-version issue12-v3-dev-replay \
              --created-at-utc "$created_at" \
              --training-end 2026-07-13 \
              --validation-start 2026-07-14 \
              --validation-end 2026-08-10 \
              --min-sample-count 30 \
              --artifact-out "$out/run${run}-artifact.json" \
              --report-out "$out/run${run}-report.json"
          done
          cmp "$out/run1-artifact.json" "$out/run2-artifact.json"
          cmp "$out/run1-report.json" "$out/run2-report.json"
          echo "ISSUE47_OUTPUT_DIR=$out" >> "$GITHUB_ENV"

      - name: Validate and print development evidence
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. uv run python - <<'PY'
          import json
          from os import environ
          from pathlib import Path

          root = Path(environ["ISSUE47_OUTPUT_DIR"])
          report = json.loads((root / "run1-report.json").read_text(encoding="utf-8"))
          assert report["fitting_policy"] == "v3-normal-runtime-v1"
          assert report["evaluation_kind"] == "development"
          assert report["validation_start"] == "2026-07-14"
          assert report["validation_end"] == "2026-08-10"
          decisions = report["group_fit_decisions"]
          eligible = [item for item in decisions if item["runtime_eligible"]]
          omitted = [item for item in decisions if not item["runtime_eligible"]]
          assert eligible
          assert all(item["runtime_distribution_type"] == "normal" for item in eligible)
          assert all(item["omission_reason"] for item in omitted)
          assert all(
              item["diagnostics"]["empirical_selection_crps"] is not None
              for item in decisions
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
          printf '%s\n' '--- deterministic V3 evidence hashes ---'
          sha256sum \
            "$ISSUE47_OUTPUT_DIR/run1-artifact.json" \
            "$ISSUE47_OUTPUT_DIR/run1-report.json" \
            "$ISSUE47_OUTPUT_DIR/run2-artifact.json" \
            "$ISSUE47_OUTPUT_DIR/run2-report.json"
          printf '%s\n' 'development evidence only — not final V3 holdout and not an accepted runtime artifact'

      - name: Upload temporary V3 development evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: issue47-v3-development-evidence
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ env.ISSUE47_OUTPUT_DIR }}/run1-artifact.json
            ${{ env.ISSUE47_OUTPUT_DIR }}/run1-report.json
