name: Issue 12 self-hosted calibration

on:
  workflow_dispatch:
  push:
    branches:
      - agent/issue-12-calibrated-uncertainty
    paths:
      - .github/workflows/issue12-selfhosted-calibration.yml

permissions:
  contents: read

concurrency:
  group: issue12-selfhosted-calibration
  cancel-in-progress: false

jobs:
  calibrate:
    name: Collect and fit calibration v1
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 180

    steps:
      - name: Check out calibration branch
        uses: actions/checkout@v6
        with:
          ref: agent/issue-12-calibrated-uncertainty
          clean: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked environment
        run: uv sync --locked --all-groups

      - name: Collect full calibration dataset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/calibration/issue12-v1
          PYTHONPATH=. uv run python -m weatherbot.forecasting.calibration_build \
            --start-date 2026-04-05 \
            --end-date 2026-08-10 \
            --cache-dir data/calibration/issue12-v1/cache \
            --records-out data/calibration/issue12-v1/dataset.jsonl \
            --manifest-out data/calibration/issue12-v1/dataset-manifest.json \
            --parity-evidence tests/fixtures/forecasting/ecmwf_single_run_parity_2026-04-18.json \
            --request-delay-seconds 0.5

      - name: Verify byte-identical offline replay
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. uv run python -m weatherbot.forecasting.calibration_build \
            --start-date 2026-04-05 \
            --end-date 2026-08-10 \
            --cache-dir data/calibration/issue12-v1/cache \
            --records-out data/calibration/issue12-v1/dataset-offline.jsonl \
            --manifest-out data/calibration/issue12-v1/dataset-manifest-offline.json \
            --parity-evidence tests/fixtures/forecasting/ecmwf_single_run_parity_2026-04-18.json \
            --offline
          cmp data/calibration/issue12-v1/dataset.jsonl data/calibration/issue12-v1/dataset-offline.jsonl
          cmp data/calibration/issue12-v1/dataset-manifest.json data/calibration/issue12-v1/dataset-manifest-offline.json

      - name: Fit issue12-v1 and evaluate untouched holdout
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. uv run python -m weatherbot.forecasting.calibration_train \
            --records data/calibration/issue12-v1/dataset.jsonl \
            --manifest data/calibration/issue12-v1/dataset-manifest.json \
            --model-version issue12-v1 \
            --created-at-utc 2026-08-13T10:10:00Z \
            --training-end 2026-07-13 \
            --validation-start 2026-07-14 \
            --validation-end 2026-08-10 \
            --min-sample-count 30 \
            --artifact-out data/calibration/issue12-v1/calibration-artifact.json \
            --report-out data/calibration/issue12-v1/holdout-report.json

      - name: Print evidence summary
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          wc -l data/calibration/issue12-v1/dataset.jsonl
          sha256sum \
            data/calibration/issue12-v1/dataset.jsonl \
            data/calibration/issue12-v1/dataset-manifest.json \
            data/calibration/issue12-v1/calibration-artifact.json \
            data/calibration/issue12-v1/holdout-report.json
          du -sh data/calibration/issue12-v1/cache
          printf '%s\n' '--- holdout report ---'
          uv run python -m json.tool data/calibration/issue12-v1/holdout-report.json

      - name: Upload normalized calibration evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: issue12-calibration-evidence
          if-no-files-found: error
          retention-days: 30
          path: |
            data/calibration/issue12-v1/dataset.jsonl
            data/calibration/issue12-v1/dataset-manifest.json
            data/calibration/issue12-v1/calibration-artifact.json
            data/calibration/issue12-v1/holdout-report.json
