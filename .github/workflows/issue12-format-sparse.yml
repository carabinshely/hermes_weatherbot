name: Format issue 12 sparse collector

on:
  push:
    branches:
      - agent/issue-12-calibrated-uncertainty
    paths:
      - .github/workflows/issue12-format-sparse.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out calibration branch
        uses: actions/checkout@v6
        with:
          ref: agent/issue-12-calibrated-uncertainty

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked development environment
        run: uv sync --locked --all-groups

      - name: Apply Ruff fixes and formatting
        run: |
          uv run ruff check --fix weatherbot/forecasting/calibration_sparse_sweep.py
          uv run ruff format weatherbot/forecasting/calibration_sparse_sweep.py

      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- weatherbot/forecasting/calibration_sparse_sweep.py; then
            echo "No formatter changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weatherbot/forecasting/calibration_sparse_sweep.py
          git commit -m "Format sparse calibration collector"
          git push origin HEAD:agent/issue-12-calibrated-uncertainty
