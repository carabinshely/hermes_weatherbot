name: Stage minimal runtime dependency boundary

on:
  push:
    branches: [agent/minimal-runtime-dependencies]

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/minimal-runtime-dependencies
          fetch-depth: 0

      - name: Apply source and documentation patch
        run: python tools/patch_dependency_boundary.py

      - name: Refresh lock file
        run: |
          python -m pip install --quiet uv==0.11.33
          uv lock

      - name: Validate minimal profile
        run: |
          rm -rf .venv
          uv sync --locked --all-groups
          uv run ruff check --fix execution_modes.py runtime_security.py weatherbot tests
          uv run ruff check --select E9,F63,F7,F82 bot_v1.py bot_v2.py bot_v3.py
          uv run ruff format execution_modes.py runtime_security.py weatherbot tests bot_v3.py
          uv run pyright execution_modes.py runtime_security.py weatherbot tests
          uv run pytest -q
          uv run python -m compileall -q execution_modes.py runtime_security.py weatherbot bot_v1.py bot_v2.py bot_v3.py tests
          uv run python - <<'PY'
          from importlib.util import find_spec

          forbidden = ("eth_account", "polymarket", "web3")
          present = [name for name in forbidden if find_spec(name) is not None]
          if present:
              raise SystemExit(f"minimal profile unexpectedly installed: {present}")
          import weatherbot.polymarket
          PY

      - name: Validate live extra
        run: |
          uv sync --locked --all-groups --extra live
          uv run --extra live python - <<'PY'
          from weatherbot.dependencies import require_live_dependencies
          from weatherbot.polymarket import OfficialPolymarketReadClient

          require_live_dependencies()
          assert OfficialPolymarketReadClient is not None
          PY
          uv run --extra live pytest -q tests/polymarket

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md bot_v3.py uv.lock weatherbot/polymarket/read_client.py weatherbot tests
          git commit -m "build: isolate live-only dependencies"
          git push origin HEAD:agent/minimal-runtime-dependencies
