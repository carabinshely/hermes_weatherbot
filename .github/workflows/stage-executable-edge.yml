name: Stage executable edge validation

on:
  push:
    branches: [agent/executable-edge-validation]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/executable-edge-validation

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install minimal development profile
        run: uv sync --locked --all-groups

      - name: Validate quote contracts
        run: |
          uv run ruff format --check weatherbot/quoting tests/quoting
          uv run ruff check weatherbot/quoting tests/quoting
          uv run pyright weatherbot/quoting tests/quoting
          uv run pytest -q tests/quoting
          uv run python -m compileall -q weatherbot/quoting tests/quoting
