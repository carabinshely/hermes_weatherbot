name: Harden persistence boundaries

on:
  push:
    branches: [agent/durable-event-store]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/durable-event-store

      - name: Apply safety hardening
        run: python tools/harden_persistence_boundaries.py

      - name: Format changed files
        run: |
          python -m pip install --quiet ruff==0.15.22
          ruff check --fix weatherbot/persistence tests/persistence
          ruff format weatherbot/persistence tests/persistence

      - name: Commit safety hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!tools/harden_persistence_boundaries.py' ':!.github/workflows/harden-persistence-boundaries.yml'
          git commit -m "fix: harden persistence failure boundaries"
          git push origin HEAD:agent/durable-event-store
