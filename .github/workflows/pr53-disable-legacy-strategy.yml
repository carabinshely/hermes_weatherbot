name: Disable PR 53 legacy strategy entrypoints

on:
  push:
    branches:
      - agent/issue-48-calibrated-runtime-boundary
    paths:
      - .github/workflows/pr53-disable-legacy-strategy.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v6
        with:
          ref: agent/issue-48-calibrated-runtime-boundary

      - name: Disable legacy strategy entrypoints
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("bot_v3_legacy.py")
          source = path.read_text(encoding="utf-8")

          scan_old = '''def scan_and_trade(context: ExecutionContext):
              """Scan markets with explicit token, quote, bucket, and local-date contracts."""
              if context.mode is ExecutionMode.PAPER:
          '''
          scan_new = '''def scan_and_trade(context: ExecutionContext):
              """Reject direct use of the quarantined pre-calibration strategy."""
              raise RuntimeError(
                  "legacy strategy scanning is disabled; use bot_v3.py calibrated RESEARCH entrypoint"
              )
              if context.mode is ExecutionMode.PAPER:
          '''
          if scan_old not in source:
              raise SystemExit("scan_and_trade patch anchor not found")
          source = source.replace(scan_old, scan_new, 1)

          execution_mode_line = '    print(f"Execution mode: {context.label}")\n'
          legacy_cli_guard = '''    if args.command in {"scan", "run"}:
              print(
                  "ERROR: legacy strategy scanning is disabled; use bot_v3.py",
                  file=sys.stderr,
              )
              return 2

          '''
          if execution_mode_line not in source:
              raise SystemExit("legacy CLI patch anchor not found")
          source = source.replace(
              execution_mode_line,
              legacy_cli_guard + execution_mode_line,
              1,
          )

          path.write_text(source, encoding="utf-8")
          PY

      - name: Commit quarantine guard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot_v3_legacy.py
          git commit -m "Hard-disable quarantined legacy strategy entrypoints"
          git push origin HEAD:agent/issue-48-calibrated-runtime-boundary
