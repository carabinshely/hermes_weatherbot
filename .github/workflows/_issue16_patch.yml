name: issue16-patch

on:
  push:
    branches: [agent/issue-16-portfolio-risk]
    paths:
      - .github/workflows/_issue16_patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/issue-16-portfolio-risk
      - name: Apply exact reducer type fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('weatherbot/domain/reducers.py')
          text = path.read_text()
          old = '''    elif isinstance(event, PortfolioValuationRecorded):\n        next_state = _apply_portfolio_valuation(state, event)\n    else:\n        raise TypeError(f"unsupported ledger event type: {type(event).__name__}")\n'''
          new = '''    else:\n        next_state = _apply_portfolio_valuation(state, event)\n'''
          if old not in text:
              raise SystemExit('expected reducer branch not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add weatherbot/domain/reducers.py
          git commit -m 'Fix exhaustive portfolio valuation reducer branch'
          git push origin HEAD:agent/issue-16-portfolio-risk
