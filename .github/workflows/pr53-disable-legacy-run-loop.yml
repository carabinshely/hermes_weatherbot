name: Disable PR 53 legacy run loop

on:
  push:
    branches:
      - agent/issue-48-calibrated-runtime-boundary
    paths:
      - .github/workflows/pr53-disable-legacy-run-loop.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v6
        with:
          ref: agent/issue-48-calibrated-runtime-boundary

      - name: Disable and compile legacy run loop
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("bot_v3_legacy.py")
          source = path.read_text(encoding="utf-8")
          old = "\n".join(
              [
                  "def run_loop(context: ExecutionContext):",
                  '    print(f"\\n{C.BOLD}{C.CYAN}🌤  Weather Trading Bot v3 — {context.label} MODE{C.RESET}")',
              ]
          )
          new = "\n".join(
              [
                  "def run_loop(context: ExecutionContext):",
                  '    raise RuntimeError(',
                  '        "legacy strategy loop is disabled; use bot_v3.py calibrated RESEARCH entrypoint"',
                  '    )',
                  '    print(f"\\n{C.BOLD}{C.CYAN}🌤  Weather Trading Bot v3 — {context.label} MODE{C.RESET}")',
              ]
          )
          if old not in source:
              raise SystemExit("run_loop patch anchor not found")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
          python -m py_compile bot_v3_legacy.py

      - name: Commit loop quarantine
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot_v3_legacy.py
          git commit -m "Hard-disable quarantined legacy run loop"
          git push origin HEAD:agent/issue-48-calibrated-runtime-boundary
