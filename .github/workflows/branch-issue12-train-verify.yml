name: Temporary issue 12 training verification

on:
  push:
    branches:
      - agent/issue-12-calibrated-uncertainty

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/issue-12-calibrated-uncertainty
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - run: uv sync --locked --all-groups
      - name: Apply bounded training typing fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match, found {count}: {old!r}")
              return text.replace(old, new)

          train_path = Path("weatherbot/forecasting/calibration_train.py")
          text = train_path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "    if isinstance(min_sample_count, bool) or not isinstance(min_sample_count, int):\n",
              "    if isinstance(min_sample_count, bool):\n",
          )
          text = replace_once(text, "    report = {\n", "    report: dict[str, object] = {\n")
          text = replace_once(
              text,
              '                "calibrated_better_mean_log_score": output.report["baseline_comparison"][\n'
              '                    "calibrated_better_mean_log_score"\n'
              '                ],\n',
              '                "calibrated_better_mean_log_score": (\n'
              '                    output.fit.validation.mean_log_score\n'
              '                    < output.fit.validation.baseline_mean_log_score\n'
              '                ),\n',
          )
          text = replace_once(
              text,
              '                "calibrated_better_mean_ranked_probability_score": output.report[\n'
              '                    "baseline_comparison"\n'
              '                ]["calibrated_better_mean_ranked_probability_score"],\n',
              '                "calibrated_better_mean_ranked_probability_score": (\n'
              '                    output.fit.validation.mean_ranked_probability_score\n'
              '                    < output.fit.validation.baseline_mean_ranked_probability_score\n'
              '                ),\n',
          )
          train_path.write_text(text, encoding="utf-8")

          test_path = Path("tests/forecasting/test_calibration_io_train.py")
          text = test_path.read_text(encoding="utf-8")
          function_start = text.index(
              "def test_training_is_deterministic_for_fixed_inputs(tmp_path: Path) -> None:\n"
          )
          replacement_start = text.index("    kwargs = {\n", function_start)
          replacement_end = text.index("\n\n    assert first.fit.artifact", replacement_start)
          replacement = '''    first = train_calibration_dataset(
              records_path=records_path,
              manifest_path=manifest_path,
              model_version="test-calibration-v1",
              created_at_utc=datetime(2026, 8, 12, 13, tzinfo=UTC),
              training_end=date(2026, 6, 10),
              validation_start=date(2026, 6, 11),
              validation_end=date(2026, 6, 14),
              min_sample_count=5,
          )
          second = train_calibration_dataset(
              records_path=records_path,
              manifest_path=manifest_path,
              model_version="test-calibration-v1",
              created_at_utc=datetime(2026, 8, 12, 13, tzinfo=UTC),
              training_end=date(2026, 6, 10),
              validation_start=date(2026, 6, 11),
              validation_end=date(2026, 6, 14),
              min_sample_count=5,
          )'''
          replacement = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in replacement.splitlines()
          )
          test_path.write_text(
              text[:replacement_start] + replacement + text[replacement_end:],
              encoding="utf-8",
          )
          PY
      - run: uv run ruff check --fix weatherbot/forecasting/calibration_io.py weatherbot/forecasting/calibration_train.py tests/forecasting/test_calibration_io_train.py
      - run: uv run ruff format weatherbot/forecasting/calibration_io.py weatherbot/forecasting/calibration_train.py tests/forecasting/test_calibration_io_train.py
      - name: Verify strict typing
        run: uv run pyright execution_modes.py runtime_security.py weatherbot tests
      - name: Verify forecasting tests
        run: PYTHONPATH=. uv run pytest -q tests/forecasting
      - name: Commit verified training pipeline
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weatherbot/forecasting/calibration_io.py weatherbot/forecasting/calibration_train.py tests/forecasting/test_calibration_io_train.py
          git commit -m "Verify deterministic calibration training pipeline"
          git push origin HEAD:agent/issue-12-calibrated-uncertainty
