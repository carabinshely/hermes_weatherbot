name: Stage authoritative resolution worker

on:
  push:
    branches: [agent/authoritative-resolution-worker]

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/authoritative-resolution-worker
          fetch-depth: 0

      - name: Apply domain and runtime patches
        run: |
          python tools/patch_resolution_evidence.py
          python tools/patch_resolution_runtime.py
          python tools/fix_resolution_typing.py

      - name: Validate implementation
        run: |
          python -m pip install --quiet uv==0.11.33
          uv lock --check
          uv sync --locked --all-groups
          uv run ruff check --fix weatherbot/domain weatherbot/persistence weatherbot/resolution tests/resolution
          uv run ruff check --select E9,F63,F7,F82 bot_v3.py
          uv run ruff format weatherbot/domain weatherbot/persistence weatherbot/resolution tests/resolution bot_v3.py
          uv run pyright execution_modes.py runtime_security.py weatherbot tests
          uv run pytest -q
          uv run python -m compileall -q weatherbot bot_v3.py

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot_v3.py weatherbot/domain weatherbot/persistence weatherbot/resolution tests/resolution
          git commit -m "feat: add authoritative resolution worker"
          git push origin HEAD:agent/authoritative-resolution-worker
