name: Apply PR 53 final Codex fixes

on:
  push:
    branches:
      - agent/issue-48-calibrated-runtime-boundary
    paths:
      - .github/workflows/pr53-codex-round2.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v6
        with:
          ref: agent/issue-48-calibrated-runtime-boundary

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked development environment
        run: uv sync --locked --all-groups

      - name: Apply review fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              source = file_path.read_text(encoding="utf-8")
              if old not in source:
                  raise SystemExit(f"patch anchor not found in {path}: {old[:100]!r}")
              file_path.write_text(source.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "bot_v3.py",
              '''def run_loop(context: ExecutionContext):
    """Run repeated calibrated RESEARCH scans; execution modes remain disabled."""
    if context.mode is not ExecutionMode.RESEARCH:
        return _blocked_strategy_scan(context)
    while True:
        scan_and_trade(context)
        time.sleep(SCAN_INTERVAL)
''',
              '''def run_loop(context: ExecutionContext):
    """Run calibrated RESEARCH scans while retaining mechanical resolution monitoring."""
    if context.mode is not ExecutionMode.RESEARCH:
        return _blocked_strategy_scan(context)

    last_full_scan = 0.0
    while True:
        now_ts = time.time()
        if now_ts - last_full_scan >= SCAN_INTERVAL:
            scan_and_trade(context)
            last_full_scan = time.time()
            continue

        try:
            run_resolution_monitor_cycle()
        except Exception as exc:
            _legacy.warn(f"Resolution monitor error: {exc}")
        time.sleep(_legacy.MONITOR_INTERVAL)
''',
          )

          gate = Path("tests/forecasting/test_calibrated_scanner_gate.py")
          gate_source = gate.read_text(encoding="utf-8")
          gate_source += '''\n\ndef test_research_run_loop_retains_resolution_monitoring(\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    events: list[str] = []\n    clock = iter((10000.0, 10000.0, 10001.0))\n\n    monkeypatch.setattr(bot_v3.time, "time", lambda: next(clock))\n    monkeypatch.setattr(\n        bot_v3,\n        "scan_and_trade",\n        lambda _context: (events.append("scan") or 0, []),\n    )\n    monkeypatch.setattr(\n        bot_v3,\n        "run_resolution_monitor_cycle",\n        lambda *_args, **_kwargs: events.append("resolve"),\n    )\n\n    class StopLoop(Exception):\n        pass\n\n    def stop_after_monitor(_seconds: float) -> None:\n        raise StopLoop\n\n    monkeypatch.setattr(bot_v3.time, "sleep", stop_after_monitor)\n\n    with pytest.raises(StopLoop):\n        bot_v3.run_loop(_context(ExecutionMode.RESEARCH))\n\n    assert events == ["scan", "resolve"]\n'''
          gate.write_text(gate_source, encoding="utf-8")

          readme = Path("README.md")
          readme_source = readme.read_text(encoding="utf-8")
          marker = "---\n![alt text](image-1.png)\n"
          notice = '''---\n\n> **Current #48A activation status:** calibrated strategy scanning is **RESEARCH-only**. `bot_v3.py scan/run --mode paper` and LIVE strategy `scan/run` are intentionally disabled and fail closed. Existing PAPER ledger/status/reset/resolution mechanics remain available. Historical target/legacy architecture sections below do not imply that automated trading is currently enabled.\n\n![alt text](image-1.png)\n'''
          if marker not in readme_source:
              raise SystemExit("README status notice anchor not found")
          readme_source = readme_source.replace(marker, notice, 1)
          readme_source = readme_source.replace(
              "uv run --no-dev python bot_v3.py scan --mode paper\n",
              "uv run --no-dev python bot_v3.py status --mode paper\n",
              1,
          )
          readme_source = readme_source.replace(
              '''# Paper-mode candidate generation; simulated fills arrive in #27
python bot_v3.py scan --mode paper
''',
              '''# PAPER strategy scan/run are intentionally disabled during #48A.\n# Administrative PAPER commands remain available:\npython bot_v3.py status --mode paper\npython bot_v3.py resolve --mode paper\n''',
              1,
          )
          readme_source = readme_source.replace(
              "That's it! The bot will continuously scan markets and trade automatically.\n",
              "During #48A the public strategy entrypoint is RESEARCH-only; PAPER/LIVE strategy execution remains explicitly disabled until the later integration gate.\n",
              1,
          )
          readme.write_text(readme_source, encoding="utf-8")

          paper_docs = Path("docs/paper-trading.md")
          paper_source = paper_docs.read_text(encoding="utf-8")
          intro = "# PAPER trading\n\n"
          intro_notice = '''# PAPER trading\n\n> **#48A integration state:** the PAPER simulation subsystem remains implemented, testable, and administratively accessible, but `bot_v3.py scan --mode paper` and `bot_v3.py run --mode paper` are intentionally disabled until the calibrated strategy-to-PAPER integration is reviewed. This phase does not generate new PAPER candidates from the public scanner.\n\n'''
          if intro not in paper_source:
              raise SystemExit("paper docs intro anchor not found")
          paper_source = paper_source.replace(intro, intro_notice, 1)
          commands_old = '''## Commands\n\nRun one PAPER scan:\n\n```bash\npython bot_v3.py scan --mode paper\n```\n\nRun continuously:\n\n```bash\npython bot_v3.py run --mode paper\n```\n\nShow PAPER account status:\n'''
          commands_new = '''## Commands\n\n### Strategy scan gate during #48A\n\nThe public PAPER strategy commands are intentionally disabled in this phase:\n\n```bash\npython bot_v3.py scan --mode paper\npython bot_v3.py run --mode paper\n```\n\nBoth exit with status 2 before strategy/calibration/network work. They are **not** the supported way to generate PAPER candidates until the remaining #48 integration is completed. The deterministic PAPER service, fixtures, ledger, recovery, valuation, risk, and settlement tests remain available.\n\nAdministrative/mechanical PAPER commands remain supported. Show PAPER account status:\n'''
          if commands_old not in paper_source:
              raise SystemExit("paper docs command anchor not found")
          paper_source = paper_source.replace(commands_old, commands_new, 1)
          paper_docs.write_text(paper_source, encoding="utf-8")
          PY

      - name: Format and lint
        run: |
          uv run ruff check --fix bot_v3.py tests/forecasting/test_calibrated_scanner_gate.py
          uv run ruff format bot_v3.py tests/forecasting/test_calibrated_scanner_gate.py
          uv run ruff check execution_modes.py runtime_security.py weatherbot tests
          uv run ruff format --check execution_modes.py runtime_security.py weatherbot tests

      - name: Type-check
        run: uv run pyright execution_modes.py runtime_security.py weatherbot tests

      - name: Focused regressions
        run: PYTHONPATH=. uv run pytest -q tests/forecasting/test_calibrated_scanner_gate.py tests/resolution/test_bot_monitor_integration.py tests/test_execution_modes.py tests/paper

      - name: Full suite
        run: PYTHONPATH=. uv run pytest -q

      - name: Commit verified fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot_v3.py README.md docs/paper-trading.md tests/forecasting/test_calibrated_scanner_gate.py
          git commit -m "Address final Codex review findings"
          git push origin HEAD:agent/issue-48-calibrated-runtime-boundary
