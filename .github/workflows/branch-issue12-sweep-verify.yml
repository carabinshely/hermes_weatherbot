name: Temporary issue 12 sparse sweep verification

on:
  push:
    branches:
      - agent/issue-12-calibrated-uncertainty
    paths:
      - .github/workflows/branch-issue12-sweep-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/issue-12-calibrated-uncertainty
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: uv sync --locked --all-groups
      - name: Apply safe lint fixes, format, and print exact diff
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check --fix weatherbot/forecasting/calibration_sweep.py tests/forecasting/test_calibration_sweep.py
          uv run ruff format weatherbot/forecasting/calibration_sweep.py tests/forecasting/test_calibration_sweep.py
          git diff -- weatherbot/forecasting/calibration_sweep.py tests/forecasting/test_calibration_sweep.py
      - name: Lint formatted patch
        run: uv run ruff check weatherbot/forecasting/calibration_sweep.py tests/forecasting/test_calibration_sweep.py
      - name: Type-check formatted patch
        run: uv run pyright weatherbot/forecasting/calibration_sweep.py tests/forecasting/test_calibration_sweep.py
      - name: Run sparse sweep tests
        run: uv run pytest -q tests/forecasting/test_calibration_sweep.py
