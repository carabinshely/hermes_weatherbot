name: Temporary issue 12 builder verification

on:
  push:
    branches:
      - agent/issue-12-calibrated-uncertainty

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/issue-12-calibrated-uncertainty
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - run: uv sync --locked --all-groups
      - name: Apply bounded builder fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match, found {count}: {old!r}")
              return text.replace(old, new)

          path = Path("weatherbot/forecasting/calibration_build.py")
          text = path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "from weatherbot.domain import MarketId\n",
              "from weatherbot.domain import MarketId, WeatherObservationEvidence\n",
          )
          text = replace_once(
              text,
              "    CalibrationLocation,\n",
              "    CalibrationLocation,\n    OpenMeteoSingleRunCapture,\n",
          )
          text = replace_once(
              text,
              "    CalibrationDataset,\n",
              "    CalibrationDataset,\n    ForecastCalibrationEvidence,\n",
          )
          text = replace_once(
              text,
              "    pairs = []\n",
              "    pairs: list[tuple[ForecastCalibrationEvidence, WeatherObservationEvidence]] = []\n",
          )
          text = replace_once(
              text,
              "        observations = {}\n",
              "        observations: dict[date, WeatherObservationEvidence] = {}\n",
          )
          text = replace_once(
              text,
              "        forecast_captures = {}\n",
              "        forecast_captures: dict[date, OpenMeteoSingleRunCapture] = {}\n",
          )
          old_constant = (
              'DEFAULT_PARITY_EVIDENCE = Path(\n'
              '    "tests/fixtures/forecasting/ecmwf_single_run_parity_2026-04-18.json"\n'
              ')\n'
          )
          old_arg = (
              '    parser.add_argument(\n'
              '        "--parity-evidence",\n'
              '        type=Path,\n'
              '        default=DEFAULT_PARITY_EVIDENCE,\n'
              '    )\n'
          )
          new_arg = (
              '    parser.add_argument(\n'
              '        "--parity-evidence",\n'
              '        type=Path,\n'
              '        required=True,\n'
              '        help="Committed archive-parity evidence JSON used to authorize the capture contract",\n'
              '    )\n'
          )
          text = replace_once(text, old_constant, "")
          text = replace_once(text, old_arg, new_arg)
          path.write_text(text, encoding="utf-8")
          PY
      - run: uv run ruff check --fix weatherbot/forecasting/calibration_build.py tests/forecasting/test_calibration_build.py
      - run: uv run ruff format weatherbot/forecasting/calibration_build.py tests/forecasting/test_calibration_build.py
      - name: Verify strict typing
        run: uv run pyright execution_modes.py runtime_security.py weatherbot tests
      - name: Verify forecasting tests
        run: PYTHONPATH=. uv run pytest -q tests/forecasting
      - name: Commit verified builder changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weatherbot/forecasting/calibration_build.py tests/forecasting/test_calibration_build.py
          git commit -m "Verify resumable calibration dataset builder"
          git push origin HEAD:agent/issue-12-calibrated-uncertainty
