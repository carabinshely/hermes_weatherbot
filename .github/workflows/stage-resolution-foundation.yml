name: Stage resolution foundation integration

on:
  push:
    branches: [agent/resolution-foundation]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/resolution-foundation
          fetch-depth: 0

      - name: Apply integration patch
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 --decode | gzip --decompress > /tmp/patch_resolution.py
          python /tmp/patch_resolution.py

      - name: Validate focused implementation
        run: |
          python -m pip install --quiet ruff==0.15.22 pyright==1.1.411 pytest==9.1.1
          ruff check --fix weatherbot/markets tests/markets bot_v3.py tests/legacy_loader.py tests/test_legacy_math.py
          ruff format weatherbot/markets tests/markets bot_v3.py tests/legacy_loader.py tests/test_legacy_math.py
          pyright weatherbot/markets tests/markets
          pytest -q tests/markets tests/test_legacy_math.py
          python -m compileall -q weatherbot/markets bot_v3.py

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot_v3.py tests/legacy_loader.py tests/test_legacy_math.py weatherbot/markets tests/markets
          git commit -m "fix: integrate resolution-safe market contracts"
          git push origin HEAD:agent/resolution-foundation
