name: Format domain package

on:
  push:
    branches: [agent/domain-state-machines]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/domain-state-machines

      - name: Apply Ruff formatting
        run: |
          python -m pip install --quiet ruff==0.15.22
          ruff format weatherbot/domain/events.py weatherbot/domain/money.py weatherbot/domain/reducers.py

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weatherbot/domain/events.py weatherbot/domain/money.py weatherbot/domain/reducers.py
          git commit -m "style: format domain package"
          git push origin HEAD:agent/domain-state-machines
