name: Tighten domain invariants

on:
  push:
    branches: [agent/domain-state-machines]

permissions:
  contents: write

jobs:
  tighten:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/domain-state-machines

      - name: Apply invariant changes
        run: python tools/tighten_domain_invariants.py

      - name: Format changed code and tests
        run: |
          python -m pip install --quiet ruff==0.15.22
          ruff check --fix weatherbot/domain tests/domain
          ruff format weatherbot/domain tests/domain

      - name: Commit invariant changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!tools/tighten_domain_invariants.py' ':!.github/workflows/tighten-domain-invariants.yml'
          git commit -m "fix: conserve order reservations"
          git push origin HEAD:agent/domain-state-machines
