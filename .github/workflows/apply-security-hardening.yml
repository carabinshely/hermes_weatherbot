name: Apply security hardening

on:
  push:
    branches: [agent/security-env-hardening]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/security-env-hardening
          fetch-depth: 0

      - name: Apply repository security hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              content = file.read_text(encoding="utf-8")
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}: {old!r}")
              file.write_text(content.replace(old, new), encoding="utf-8")

          config_path = Path("config.json")
          config = json.loads(config_path.read_text(encoding="utf-8"))
          for key in ("vc_key", "telegram_bot_token", "telegram_chat_id"):
              config.pop(key, None)
          config_path.write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")

          replace_once("bot_v2.py", 'VC_KEY           = _cfg.get("vc_key", "")\n', "")
          replace_once("bot_v3.py", 'VC_KEY        = _cfg.get("vc_key", "")\n', "")
          replace_once(
              "bot_v3.py",
              'TELEGRAM_BOT_TOKEN = _cfg.get("telegram_bot_token", "")\n'
              'TELEGRAM_CHAT_ID   = _cfg.get("telegram_chat_id", "")\n',
              'TELEGRAM_BOT_TOKEN = os.getenv("TELEGRAM_BOT_TOKEN", "").strip()\n'
              'TELEGRAM_CHAT_ID   = os.getenv("TELEGRAM_CHAT_ID", "").strip()\n',
          )
          replace_once(
              "bot_v3.py",
              'if __name__ == "__main__":\n'
              '    if not PK or not WALLET:\n',
              'if __name__ == "__main__":\n'
              '    print(credential_status_line())\n'
              '    if not PK or not WALLET:\n',
          )
          replace_once(
              "bot_v3.py",
              'import threading\n',
              'import threading\n\nfrom runtime_security import credential_status_line\n',
          )

          Path("runtime_security.py").write_text(
              '''from __future__ import annotations\n\nimport os\nfrom collections.abc import Mapping, Sequence\n\nDEFAULT_CREDENTIAL_NAMES = (\n    "PK",\n    "WALLET",\n    "SIG_TYPE",\n    "TELEGRAM_BOT_TOKEN",\n    "TELEGRAM_CHAT_ID",\n)\n\n\ndef credential_status(\n    names: Sequence[str] = DEFAULT_CREDENTIAL_NAMES,\n    environ: Mapping[str, str] | None = None,\n) -> dict[str, str]:\n    """Return only configured/unset states; never return credential values."""\n    source = os.environ if environ is None else environ\n    return {name: "configured" if source.get(name, "").strip() else "unset" for name in names}\n\n\ndef credential_status_line(\n    names: Sequence[str] = DEFAULT_CREDENTIAL_NAMES,\n    environ: Mapping[str, str] | None = None,\n) -> str:\n    states = credential_status(names=names, environ=environ)\n    return "Credentials: " + ", ".join(f"{name}={state}" for name, state in states.items())\n''',
              encoding="utf-8",
          )

          Path(".env.example").write_text(
              '''# WeatherBot local environment\n# Copy to .env. Never commit .env or real values.\n\n# Live-wallet settings. Research and paper modes must eventually run without these.\nPK=\nWALLET=\nSIG_TYPE=0\n\n# Optional Telegram notifications.\nTELEGRAM_BOT_TOKEN=\nTELEGRAM_CHAT_ID=\n''',
              encoding="utf-8",
          )

          Path("SECURITY.md").write_text(
              '''# Security policy\n\n## Credentials\n\nAll credentials must be loaded from environment variables or an external secret store.\n`config.json` is public configuration and must never contain tokens, private keys, chat IDs,\nor provider credentials.\n\nSupported legacy environment variables are:\n\n- `PK`\n- `WALLET`\n- `SIG_TYPE`\n- `TELEGRAM_BOT_TOKEN`\n- `TELEGRAM_CHAT_ID`\n\nRuntime diagnostics may report only whether a value is configured. They must never print,\nlog, serialize, or include the credential value in an exception message.\n\n## Rotation procedure\n\n1. Stop every process using the exposed credential.\n2. Revoke the old credential at its provider.\n3. Create a replacement only if the integration is still needed.\n4. Store the replacement outside Git and deploy it through the environment or a secret store.\n5. Confirm the old credential no longer authenticates.\n6. Run the repository secret scans before redeployment.\n\nFor Telegram bot tokens, revoke and regenerate the token through Telegram's official bot\nmanagement interface. The historical `vc_key` is unused by the current code; its owner must\nidentify the issuing provider and revoke it there.\n\n## Historical exposure inherited from upstream\n\nThis repository is a fork of `nicolastinkl/hermes_weatherbot`. The exposed values existed in\nthe upstream Git history before this fork was created. Rewriting this fork alone cannot remove\nobjects that remain reachable from the public upstream repository or GitHub fork network.\nCredential revocation is therefore mandatory and provides the actual containment. Do not copy\nor quote historical values in issues, pull requests, logs, or documentation.\n\n## Reporting\n\nReport suspected vulnerabilities privately to the repository owner. Do not open a public issue\nthat contains a credential or an exploit payload.\n''',
              encoding="utf-8",
          )

          security = Path(".github/workflows/security.yml")
          content = security.read_text(encoding="utf-8")
          marker = '''      - name: Scan current tree\n        run: |\n'''
          canary = '''      - name: Verify scanner detects a generated canary\n        run: |\n          mkdir -p /tmp/gitleaks-canary\n          printf 'AWS_ACCESS_KEY_ID=AKIA0123456789ABCDEF\\n' > /tmp/gitleaks-canary/canary.env\n          if "$(go env GOPATH)/bin/gitleaks" dir /tmp/gitleaks-canary --redact --no-banner; then\n            echo "Gitleaks failed to detect the generated canary" >&2\n            exit 1\n          fi\n\n'''
          if marker not in content:
              raise SystemExit("security workflow scan marker not found")
          security.write_text(content.replace(marker, canary + marker, 1), encoding="utf-8")

          tests = Path("tests/test_repository_safety.py")
          content = tests.read_text(encoding="utf-8")
          content = content.replace(
              '''    for key in SENSITIVE_CONFIG_KEYS:\n        assert not config.get(key), f"{key} must not contain a committed value"\n''',
              '''    assert SENSITIVE_CONFIG_KEYS.isdisjoint(config), (\n        "secret-shaped keys must not exist in committed configuration"\n    )\n''',
          )
          content += '''\n\ndef test_legacy_bot_loads_notifications_from_environment_only() -> None:\n    source = Path("bot_v3.py").read_text(encoding="utf-8")\n    assert '_cfg.get("telegram_bot_token"' not in source\n    assert '_cfg.get("telegram_chat_id"' not in source\n    assert '_cfg.get("vc_key"' not in source\n    assert 'os.getenv("TELEGRAM_BOT_TOKEN"' in source\n    assert 'os.getenv("TELEGRAM_CHAT_ID"' in source\n\n\ndef test_unused_vc_key_is_removed_from_legacy_bots() -> None:\n    for path in (Path("bot_v2.py"), Path("bot_v3.py")):\n        assert "VC_KEY" not in path.read_text(encoding="utf-8")\n'''
          tests.write_text(content, encoding="utf-8")

          Path("tests/test_runtime_security.py").write_text(
              '''from __future__ import annotations\n\nfrom runtime_security import credential_status, credential_status_line\n\n\ndef test_credential_status_never_returns_values() -> None:\n    environment = {\n        "PK": "super-secret-private-key",\n        "WALLET": "0x1234",\n        "TELEGRAM_BOT_TOKEN": "123456:secret-token",\n    }\n    states = credential_status(environ=environment)\n    assert states["PK"] == "configured"\n    assert states["WALLET"] == "configured"\n    assert states["TELEGRAM_BOT_TOKEN"] == "configured"\n    assert states["TELEGRAM_CHAT_ID"] == "unset"\n    rendered = credential_status_line(environ=environment)\n    for value in environment.values():\n        assert value not in rendered\n\n\ndef test_credential_status_treats_whitespace_as_unset() -> None:\n    states = credential_status(names=("TOKEN",), environ={"TOKEN": "   "})\n    assert states == {"TOKEN": "unset"}\n''',
              encoding="utf-8",
          )

          pyproject = Path("pyproject.toml")
          content = pyproject.read_text(encoding="utf-8")
          content = content.replace('include = ["tests"]', 'include = ["runtime_security.py", "tests"]')
          content = content.replace('source = ["tests"]', 'source = ["runtime_security", "tests"]')
          pyproject.write_text(content, encoding="utf-8")

          Path(".github/workflows/apply-security-hardening.yml").unlink()
          PY

      - name: Format maintained Python code
        run: |
          python -m pip install --quiet ruff==0.15.22
          ruff format runtime_security.py tests
          ruff check --fix runtime_security.py tests

      - name: Commit hardening changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "security: require environment-only credentials"
          git push origin HEAD:agent/security-env-hardening
